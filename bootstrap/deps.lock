a1	curl -fsSL https://git.cn-hangzhou.oss-cdn.aliyun-inc.com/aone-cli/install.sh | sh	https://a1.io.alibaba-inc.com/docs/guide/
aliyun	if [ "$(uname)" = Darwin ]; then curl -fsSL https://aliyuncli.alicdn.com/install.sh | /bin/bash; else V=3.4.8; mkdir -p ~/.local/bin && curl -fsSL "https://aliyuncli.alicdn.com/aliyun-cli-linux-$V-amd64.tgz" | tar xz -C ~/.local/bin && chmod +x ~/.local/bin/aliyun; fi	https://help.aliyun.com/zh/cli/install-update-alibaba-cloud-cli
cloudspec	V=1.1.39; case "$(uname)" in Darwin) P=mac;; *) P=linux;; esac; case "$(uname -m)" in arm64|aarch64) A=arm64;; *) A=amd64;; esac; t=$(mktemp -d) && curl -fsSL "https://acube.aliyun-inc.com/api/v1/cloudspec/cli/download/$V?file=cloudspec-$P-$A.zip" -o "$t/cs.zip" && mkdir -p ~/.local/opt ~/.local/bin && unzip -oq "$t/cs.zip" -d ~/.local/opt/cloudspec && chmod +x ~/.local/opt/cloudspec/cloudspec && ln -sfn ~/.local/opt/cloudspec/cloudspec ~/.local/bin/cloudspec && rm -rf "$t"	https://aliyuque.antfin.com/cloudspec/model/cli-install
amp	AMP_DOWNLOAD_URL=https://amp-cli.oss-cn-beijing.aliyuncs.com/0.1.0; export AMP_DOWNLOAD_URL; curl -fsSL "$AMP_DOWNLOAD_URL/install.sh" | sh; amp upgrade --yes --no-interactive	https://ampv2inner-share.aliyuncs.com
gh	if [ "$(uname)" = Darwin ]; then brew install gh; else V=2.96.0; mkdir -p ~/.local/bin && curl -fsSL --connect-timeout 15 "${JARVIS_GH_URL:-https://github.com/cli/cli/releases/download/v$V/gh_${V}_linux_amd64.tar.gz}" | tar xz -C ~/.local/bin --strip-components=2 "gh_${V}_linux_amd64/bin/gh" && chmod +x ~/.local/bin/gh; fi	https://cli.github.com/
