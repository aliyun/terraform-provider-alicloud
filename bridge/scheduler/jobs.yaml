# Scheduler Job 的唯一注册表。
#
# 文件中只列出已迁移到新 Scheduler 的 Job。未出现在此处的任务不会注册到
# jarvis_scheduled_job。每次迁移一个 Job 时，先实现 runners/ 下的 runner，再新增
# 一条完整定义，并删除该 Job 的旧入口。
#
# key            稳定 Job 标识，也是控制面 job_key；迁移后不得重命名。
# revision       definition 语义变化时递增；用于识别已登记 Job 是否需要更新。
# description    面向控制台的中文任务说明。
# schedule       支持 interval / daily / adaptive；daily 使用明确的 IANA 时区。
# runner         唯一执行契约；handler_key 或 builder_ref/protocol 必须在 runners/ 中注册。
# misfire        停机后错过计划的处理策略；CURRENT_DAY 仅补当天的 daily slot。
# retry_delay_seconds  可重试失败后再次执行同一 slot 的等待时间；daily 不跨下一计划边界。
# enabled        Job 是否执行；false 时仍注册到控制面，但状态为 DISABLED。
version: 1
jobs:
  # 预发调度链路验证：三条 Job 分别覆盖 interval、daily、adaptive。runner 只写日志
  # 并返回 SUCCEEDED，不创建业务数据。验证结束后可将整个 smoke 区块注释为新增 Job
  # 配置示例。业务 Job 迁移前必须先实现独立 runner，再单独加入此表。
  - key: smoke.interval
    revision: 3
    description: 验证固定间隔任务的计划、准入与完成，不产生业务副作用
    schedule: {kind: interval, interval_seconds: 60, run_immediately: true}
    runner: {kind: handler, handler_key: scheduler.smoke}
    misfire: COALESCE
    retry_delay_seconds: 10
    enabled: true

  - key: smoke.daily
    revision: 3
    description: 验证每日任务的计划与当天错过执行处理，不产生业务副作用
    schedule: {kind: daily, hour: 10, minute: 0, timezone: Asia/Shanghai}
    runner: {kind: handler, handler_key: scheduler.smoke}
    misfire: CURRENT_DAY
    retry_delay_seconds: 10
    enabled: true

  - key: smoke.adaptive
    revision: 3
    description: 验证自适应任务的计划与下一次执行时间计算，不产生业务副作用
    schedule: {kind: adaptive, min_delay_seconds: 30, default_delay_seconds: 60, max_delay_seconds: 120, run_immediately: true}
    runner: {kind: handler, handler_key: scheduler.smoke}
    misfire: COALESCE
    retry_delay_seconds: 10
    enabled: true

  # 首次只注册到控制面验证 definition/看板，不执行真实探测。确认后通过单独变更将
  # revision 升至 3 并设置 enabled: true，避免当天 10:00 后首次启动触发 CURRENT_DAY 补跑。
  - key: daily.probe
    revision: 2
    description: 每日启动独立 Terraform Headless 会话执行合成客户探测并归档摘要
    schedule: {kind: daily, hour: 10, minute: 0, timezone: Asia/Shanghai}
    runner: {kind: headless, builder_ref: probe.daily, protocol: probe-result-v1, session_policy: NEW, lane: terraform}
    misfire: CURRENT_DAY
    retry_delay_seconds: 300
    enabled: false
