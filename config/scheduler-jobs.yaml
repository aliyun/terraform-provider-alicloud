# Complete registry of jobs already migrated to the new Scheduler. Legacy jobs
# do not appear here and are never registered through the new control plane.
# Add a complete Job definition only when its engine_runner is ready.
version: 1
jobs:
  - key: daily.probe
    revision: 1
    description: Run the bounded daily probe as an Ephemeral job
    purpose: DISCOVERY
    engine_runner: daily.probe
    schedule: {kind: daily, hour: 10, minute: 0, timezone: Asia/Shanghai}
    runner: {kind: headless, builder_ref: bridge.daily_probe, protocol: bridge.scheduler.v1, session_policy: EPHEMERAL, lane: terraform}
    misfire: CURRENT_DAY
    timeout_seconds: 3600
    retry_delay_seconds: 300
    replay_policy: EPHEMERAL
    enabled_env: JARVIS_PROBE_SCHED
