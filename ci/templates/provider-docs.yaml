          exit 1
        fi
        printf %s "$CHECKER_SHA" > "$AONE_CI_OUTPUTS/sha"
    - uses: checkout
      inputs:
        repository-url: https://gitlab.alibaba-inc.com/opensource-tools/terraform-provider-alicloud.git
        ref: '${{ ''refs/heads/'' + (git.merge_request.targetBranch ?: git.defaultBranch) }}'
        commit: ${{ steps.checker_pin.outputs.sha }}
        path: .git/provider-checker
        fetch-depth: '1'
    - name: Verify checker and candidate revisions
      run: |
        set -euo pipefail
        if ! IFS= read -r CHECKER_SHA < .git/provider-pin/provider-checker.sha || [[ ! "$CHECKER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Missing or invalid checker revision. Start a new pipeline run to regenerate the PinChecker artifact." >&2
          exit 1
        fi
        test "$(git rev-parse HEAD)" = "$CODE_HEAD"
        actual=$(git -C .git/provider-checker rev-parse HEAD)
        if [[ "$actual" != "$CHECKER_SHA" ]]; then
          echo "Checker checkout is $actual, expected $CHECKER_SHA from PinChecker. Start a new pipeline run." >&2
          exit 1
        fi
        export GIT_ALTERNATE_OBJECT_DIRECTORIES="$(git -C .git/provider-checker rev-parse --absolute-git-dir)/objects"
        git restore --worktree --no-overlay --source="$CHECKER_SHA" -- scripts/document
    - name: Setup Go
      uses: setup-env
      inputs:
        go-version: 1.25.8
    - name: Checking the docs content
      run: |
        set -euo pipefail
        range=$(python3 .git/provider-checker/scripts/ci/aone-range.py)
        eval "$range"
        checker_dir=$(mktemp -d)
        trap 'rm -rf "$checker_dir"' EXIT
        # scripts/document/document_check.go classifies pages by directory
        # (r, d, actions, ephemeral-resources, functions, guides) and only
        # applies the generated-name title template to object pages; both CI
        # entries share that classification. The provider index page stays
        # excluded because its argument notes and shell examples do not fit
        # the page sections the checker walks.
        while IFS= read -r -d '' doc; do
          if [[ -f "$doc" && "$doc" != website/docs/index.html.markdown ]]; then
            if [[ ! -x "$checker_dir/document-check" ]]; then
              go build -o "$checker_dir/document-check" scripts/document/document_check.go
            fi
            "$checker_dir/document-check" "$doc"
          fi
        done < <(git diff --name-only -z --diff-filter=ACMR "$DIFF_BASE" "$DIFF_HEAD" -- website/docs)
    - name: Test document checker and check spelling
      run: |
        set -euo pipefail
        range=$(python3 .git/provider-checker/scripts/ci/aone-range.py)
        eval "$range"
        go test ./scripts/document/
        export TF_DOC_TOOLS_DIR
        TF_DOC_TOOLS_DIR=$(mktemp -d)
        trap 'rm -rf "$TF_DOC_TOOLS_DIR"' EXIT
        GOBIN="$TF_DOC_TOOLS_DIR" go install github.com/client9/misspell/cmd/misspell@v0.3.4
        python3 .git/provider-checker/scripts/ci/run-document-checks.py --group spelling
  Consistency:
    needs:
    - PinChecker
    - CheckScope
    when: ${{ jobs.CheckScope.outputs.provider == 'yes' }}
    steps:
    - name: Setup Go
      uses: setup-env
      inputs:
        go-version: 1.25.8
    - uses: checkout
      inputs:
        fetch-depth: '32'
