        go-version: 1.25.8
    - name: Check new service file layout
      run: |
        set -euo pipefail
        range=$(python3 .git/provider-checker/scripts/ci/aone-range.py)
        eval "$range"
        GO111MODULE=off GOWORK=off go run .git/provider-checker/scripts/ci/accscope/main.go .git/provider-checker/scripts/ci/accscope/layout.go \
