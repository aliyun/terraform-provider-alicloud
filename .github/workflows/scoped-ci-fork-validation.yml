name: Scoped CI fork validation
on:
  push:
    branches: ['codex/scope-ci-checks']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    if: github.repository != 'aliyun/terraform-provider-alicloud'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .go-version
          cache: false
      - name: Run diff selection and compatibility regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s scripts/ci -p test_check_scope.py
          python3 -m unittest discover -s scripts/ci -p test_document_checks.py
          bash scripts/ci/resolve-change-range_test.sh
      - name: Install pinned check tools
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.24.0
          mkdir -p "$HOME/.cache/terraform-doc-tools" "$RUNNER_TEMP/golangci"
          GOBIN="$HOME/.cache/terraform-doc-tools" go install github.com/client9/misspell/cmd/misspell@v0.3.4
          GOBIN="$HOME/.cache/terraform-doc-tools" go install github.com/katbyte/terrafmt@v0.5.7
          curl --fail --location --retry 3 https://github.com/golangci/golangci-lint/releases/download/v2.7.2/golangci-lint-2.7.2-linux-amd64.tar.gz -o "$RUNNER_TEMP/golangci.tar.gz"
          tar -xzf "$RUNNER_TEMP/golangci.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/golangci"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/golangci" >> "$GITHUB_PATH"
      - name: Verify real tools catch changed-file failures
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/ci/smoke_ci_checks.py
