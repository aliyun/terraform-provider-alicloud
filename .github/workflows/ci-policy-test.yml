name: CI Policy Test
on:
  # Standalone unit tests for the route policy action. This workflow runs
  # independently of the Basic Policy route job (it tests the routing logic
  # itself, so depending on routing would be circular). It runs on
  # ubuntu-latest with no secrets, the same sandbox used for external PR
  # consumer jobs, so PR-controlled JavaScript cannot reach credentials.
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - master
    paths:
      - .github/actions/terraform-ci-select-policy/**
      - .github/workflows/ci-policy-test.yml
      - scripts/ci/restore-local-go-cache.py
      - scripts/ci/test_local_go_cache.py
      - scripts/ci/test_workload_go_cache.py
      - scripts/ci/run-ci-fixtures.py
      - scripts/ci/test_fixture_compat.py
      - scripts/ci/test_go_cache.py
      - scripts/ci/ensure-writable-go-cache.sh
      - scripts/ci/test_ensure_writable_go_cache.py
      - scripts/ci/test_bootstrap_go_cache.py
      - .github/workflows/acctest-terraform-basic.yml
      - .github/workflows/document-check.yml
      - .github/workflows/consistency-check.yml
      - .github/workflows/acctest-terraform-lint.yml
      - .github/workflows/testing-coverage-rate.yml
      - .github/workflows/collection-order-coverage.yml
  push:
    branches:
      - master
    paths:
      - .github/actions/terraform-ci-select-policy/**
      - .github/workflows/ci-policy-test.yml
      - scripts/ci/restore-local-go-cache.py
      - scripts/ci/test_local_go_cache.py
      - scripts/ci/test_workload_go_cache.py
      - scripts/ci/run-ci-fixtures.py
      - scripts/ci/test_fixture_compat.py
      - scripts/ci/test_go_cache.py
      - scripts/ci/ensure-writable-go-cache.sh
      - scripts/ci/test_ensure_writable_go_cache.py
      - scripts/ci/test_bootstrap_go_cache.py
      - .github/workflows/acctest-terraform-basic.yml
      - .github/workflows/document-check.yml
      - .github/workflows/consistency-check.yml
      - .github/workflows/acctest-terraform-lint.yml
      - .github/workflows/testing-coverage-rate.yml
      - .github/workflows/collection-order-coverage.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route-policy-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - name: Run route policy unit tests
        run: node --test .github/actions/terraform-ci-select-policy/route.test.js

  go-cache-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .go-version
          cache: false
      - name: Test cache reuse and publication boundaries
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test*go_cache.py'
          python3 -m unittest discover -s scripts/ci -p test_fixture_compat.py
