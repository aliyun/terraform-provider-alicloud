name: Golangci-Lint
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - master
    paths:
      - .github/workflows/acctest-terraform-lint.yml
      - '**/*.go'
      - go.mod
      - go.sum
      - .go-version
      - .golangci.yml
      - .golangci.yaml
      - scripts/ci/check_scope.py
      - scripts/ci/test_check_scope.py
      - scripts/run-tflint.sh
      - scripts/ci/resolve-change-range.sh
      - scripts/ci/resolve-change-range_test.sh
      - scripts/ci/run-tflint_test.sh
      - scripts/ci/initialization-check.sh
      - scripts/ci/initialization-check_test.sh
      - scripts/ci/scoping-init-regression.sh
      - scripts/ci/scoping-init-regression_test.sh
      - scripts/local-ci-check.sh

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    permissions:
      checks: read
      pull-requests: read
    # API-only discovery has its own restricted pool, separate from Gate workers.
    runs-on: terraform-ci-route
    timeout-minutes: 5
    outputs:
      classification: ${{ steps.select.outputs.classification }}
      runner: ${{ steps.select.outputs.runner }}
      heavy_runner: ${{ steps.select.outputs.heavy_runner }}
    steps:
      - name: Select runner
        id: select
        uses: aliyun/terraform-provider-alicloud/.github/actions/terraform-ci-select-policy@cc0a874ce1783a88cc1bacfb961e4dd7c909cbb6

  errcheck:
    name: runner / errcheck
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    permissions:
      contents: read
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Resolve change range
        id: change-range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CI_BASE_REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: scripts/ci/resolve-change-range.sh >> "$GITHUB_OUTPUT"
      - name: Select errcheck packages
        id: scope
        env:
          DIFF_BASE: ${{ steps.change-range.outputs.diff_base }}
          DIFF_HEAD: ${{ steps.change-range.outputs.diff_head }}
        run: |
          if [[ -f scripts/ci/check_scope.py ]]; then
            python3 scripts/ci/check_scope.py --errcheck-output >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "packages=./..." >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare writable Go/tool cache
        # Route A: keep caches when HOME-owned defaults are writable; redirect
        # only the unwritable ones to a per-job $RUNNER_TEMP subdir. Exports
        # GOPATH/GOBIN/GOCACHE/GOMODCACHE/GOLANGCI_LINT_CACHE before reviewdog's
        # internal Go setup so errcheck/golangci-lint no longer hit EACCES on a
        # polluted /home/runner on the trusted fleet.
        if: steps.scope.outputs.needed == 'true'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_BASE_REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: |
          # Older PR checkouts may predate this helper. Keep legacy tool paths
          # defined, then prefer the PR helper or its exact, validated base SHA.
          echo "TF_CI_TOOLS_DIR=${TF_CI_TOOLS_DIR:-$HOME/.cache/terraform-ci-tools}" >> "$GITHUB_ENV"
          echo "TF_DOC_TOOLS_DIR=${TF_DOC_TOOLS_DIR:-$HOME/.cache/terraform-doc-tools}" >> "$GITHUB_ENV"
          helper=scripts/ci/ensure-writable-go-cache.sh
          if [[ ! -s "$helper" && "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            helper="$RUNNER_TEMP/ensure-writable-go-cache.sh"
            if ! git show "$PR_BASE_SHA:scripts/ci/ensure-writable-go-cache.sh" > "$helper" 2>/dev/null; then
              git config --local --replace-all remote.ci-base.url "$CI_BASE_REPOSITORY_URL"
              git config --local remote.ci-base.promisor true
              git config --local remote.ci-base.partialclonefilter blob:none
              if ! git fetch --no-tags --no-recurse-submodules --filter=blob:none ci-base "$PR_BASE_SHA" ||
                 ! git show "$PR_BASE_SHA:scripts/ci/ensure-writable-go-cache.sh" > "$helper"; then
                rm -f "$helper"
              fi
            fi
          fi
          if [[ -s "$helper" ]]; then
            bash "$helper"
          else
            echo '::notice::Writable-cache helper unavailable; using runner defaults.'
          fi
      - name: errcheck
        if: steps.scope.outputs.needed == 'true'
        uses: reviewdog/action-golangci-lint@284129a3ac23bc5d8ac1522e0b6511df74a8836d # v2.10.2
        with:
          go_version_file: .go-version
          cache: false
          golangci_lint_flags: '--tests=false --timeout=25m --default=none -E errcheck --new-from-rev=${{ steps.change-range.outputs.diff_base }} ${{ steps.scope.outputs.packages }}'
          tool_name: errcheck
          level: info
          reviewdog_version: 'v0.21.0'
          golangci_lint_version: 'v2.7.2'

  tflint:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.heavy_runner) }}
    env:
      # Isolate this legacy analyzer from the provider's Go version.
      GOTOOLCHAIN: go1.26.10
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Test change range and lint scoping
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CI_BASE_REPOSITORY_URL: ${{ github.event.pull_request.base.repo.clone_url }}
        run: |
          scripts/ci/resolve-change-range_test.sh
          scripts/ci/run-tflint_test.sh
          # #11312 added initialization-check_test.sh to this step; this PR adds
          # scoping-init-regression.sh/_test.sh to gate it for pre-#11312 heads.
          # The workflow definition runs from the merge commit (base+head), but
          # the checked-out working tree is the PR HEAD. A head that predates
          # these entries (e.g. an in-flight migration PR forked before #11312)
          # lacks them, so a bare `scripts/ci/scoping-init-regression.sh` call
          # would itself exit 127 -- the very noise failure this PR fixes.
          # Materialize the runner and its test from a trusted, immutable
          # source (the GitHub-event base = master tip, content-addressed) into
          # a temp tool dir; fall back to the checked-out HEAD only when the
          # base predates this entry (this PR's own pre-merge CI). The
          # materialized runner is trusted; the working tree stays the head
          # under test, so a PR cannot ship a tampered runner to bypass the
          # regression, and a head that deletes/tampers the init test still
          # fails (boundary-checked against the trusted merge-base).
          tool_dir="$RUNNER_TEMP/scoping-init-regression"
          mkdir -p "$tool_dir"
          # materialize_scoping_entry echoes (to stdout) the trusted source SHA it
          # used, so the workflow can pass it to the materialized _test as
          # SCOPING_TOOL_SOURCE_SHA. The _test must NOT assume the checked-out
          # HEAD is the tool source: on a real pre-#11312 head, HEAD lacks both
          # the new entry and the init-test add history.
          materialize_scoping_entry() {
            local repo_path="$1" dest="$2"
            if [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
               && git show "${PR_BASE_SHA}:${repo_path}" >"$dest" 2>/dev/null; then
              printf '%s\n' "$PR_BASE_SHA"
              return 0
            fi
            if [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! -s "$dest" ]]; then
              git config --local --replace-all remote.ci-base.url "$CI_BASE_REPOSITORY_URL"
              git config --local remote.ci-base.promisor true
              git config --local remote.ci-base.partialclonefilter blob:none
              git fetch --no-tags --no-recurse-submodules --filter=blob:none \
                ci-base "$PR_BASE_SHA" >/dev/null 2>&1 || true
              if git show "${PR_BASE_SHA}:${repo_path}" >"$dest" 2>/dev/null; then
                printf '%s\n' "$PR_BASE_SHA"
                return 0
              fi
            fi
            # Base predates this entry (this PR's pre-merge CI): the HEAD is the
            # content under review. A genuinely old head is served from the base
            # path above once this PR merges to master.
            if [[ -r "$repo_path" ]]; then
              cp "$repo_path" "$dest"
              printf '%s\n' "$(git rev-parse HEAD)"
              return 0
            fi
            echo "::error::could not materialize ${repo_path} from the trusted base or HEAD; cannot run the scoping regression (no silent skip)." >&2
            return 1
          }
          SCOPING_TOOL_SOURCE_SHA="$(materialize_scoping_entry scripts/ci/scoping-init-regression.sh "$tool_dir/scoping-init-regression.sh")" || exit 1
          materialize_scoping_entry scripts/ci/scoping-init-regression_test.sh "$tool_dir/scoping-init-regression_test.sh" >/dev/null || exit 1
          export SCOPING_TOOL_SOURCE_SHA
          chmod +x "$tool_dir/scoping-init-regression.sh" "$tool_dir/scoping-init-regression_test.sh"
          "$tool_dir/scoping-init-regression.sh"
          "$tool_dir/scoping-init-regression_test.sh"
      - name: Resolve change range
        id: change-range
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CI_BASE_REPOSITORY_URL: ${{ github.event.pull_request.base.repo.clone_url }}
        run: scripts/ci/resolve-change-range.sh >> "$GITHUB_OUTPUT"
      - name: Prepare writable Go/tool cache
        # Route A: keep caches when HOME-owned defaults are writable; redirect
        # only the unwritable ones to a per-job $RUNNER_TEMP subdir so a polluted
        # /home/runner on the trusted fleet no longer causes EACCES in setup-go,
        # go install or the tfproviderlint tool drop. Runs before setup-go.
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_BASE_REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: |
          # Older PR checkouts may predate this helper. Keep legacy tool paths
          # defined, then prefer the PR helper or its exact, validated base SHA.
          echo "TF_CI_TOOLS_DIR=${TF_CI_TOOLS_DIR:-$HOME/.cache/terraform-ci-tools}" >> "$GITHUB_ENV"
          echo "TF_DOC_TOOLS_DIR=${TF_DOC_TOOLS_DIR:-$HOME/.cache/terraform-doc-tools}" >> "$GITHUB_ENV"
          helper=scripts/ci/ensure-writable-go-cache.sh
          if [[ ! -s "$helper" && "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            helper="$RUNNER_TEMP/ensure-writable-go-cache.sh"
            if ! git show "$PR_BASE_SHA:scripts/ci/ensure-writable-go-cache.sh" > "$helper" 2>/dev/null; then
              git config --local --replace-all remote.ci-base.url "$CI_BASE_REPOSITORY_URL"
              git config --local remote.ci-base.promisor true
              git config --local remote.ci-base.partialclonefilter blob:none
              if ! git fetch --no-tags --no-recurse-submodules --filter=blob:none ci-base "$PR_BASE_SHA" ||
                 ! git show "$PR_BASE_SHA:scripts/ci/ensure-writable-go-cache.sh" > "$helper"; then
                rm -f "$helper"
              fi
            fi
          fi
          if [[ -s "$helper" ]]; then
            bash "$helper"
          else
            echo '::notice::Writable-cache helper unavailable; using runner defaults.'
          fi
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Restore node-local Go cache
        id: local-go-cache
        if: ${{ needs.route.outputs.classification == 'trusted' }}
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Older PR heads may lack the helper. Use their exact base fixture.
          helper=scripts/ci/restore-local-go-cache.py
          if [[ ! -f "$helper" && "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            helper="$RUNNER_TEMP/restore-local-go-cache.py"
            if ! git show "$PR_BASE_SHA:scripts/ci/restore-local-go-cache.py" > "$helper"; then
              rm -f "$helper"
            fi
          fi
          # The administrator helper is read-only and still validates checkout hashes.
          if [[ ! -s "$helper" && -f /opt/terraform-ci-cache/restore.py ]]; then
            helper=/opt/terraform-ci-cache/restore.py
          fi
          if [[ -s "$helper" ]]; then
            python3 "$helper"
          else
            echo 'hit=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve Go cache paths
        id: go-cache
        shell: bash
        run: |
          # Go rehydrates module sources from these verified downloads.
          # Do not transfer both the zip files and their expanded copies.
          echo "module=$(go env GOMODCACHE)/cache/download" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore trusted Go cache
        if: ${{ needs.route.outputs.classification == 'trusted' && steps.local-go-cache.outputs.hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.module }}
            ${{ steps.go-cache.outputs.build }}
          key: provider-go-download-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version') }}-${{ hashFiles('go.mod', 'go.sum') }}
      - name: Restore trusted tfproviderlint binary
        if: ${{ needs.route.outputs.classification == 'trusted' }}
        id: tfproviderlint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_CI_TOOLS_DIR }}/tfproviderlint
          key: tfproviderlint-v2-${{ runner.os }}-${{ runner.arch }}-go1.26.10-v0.31.0
      - name: Install tfproviderlint
        if: steps.tfproviderlint-cache.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/tfproviderlint-bin
        run: |
          mkdir -p "$GOBIN" "$TF_CI_TOOLS_DIR"
          go install github.com/bflad/tfproviderlint/cmd/tfproviderlint@v0.31.0
          cp "$GOBIN/tfproviderlint" "$TF_CI_TOOLS_DIR/tfproviderlint"
      - name: Add tfproviderlint to PATH
        run: echo "$TF_CI_TOOLS_DIR" >> "$GITHUB_PATH"
      - name: Run tfproviderlint
        env:
          DIFF_BASE: ${{ steps.change-range.outputs.diff_base }}
          DIFF_HEAD: ${{ steps.change-range.outputs.diff_head }}
        run: ./scripts/run-tflint.sh
