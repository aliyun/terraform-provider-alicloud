name: Issue Triage

# Automatic labeling and a short acknowledgment reply for newly opened
# issues. Fire-and-forget: the workflow runs once per issue, only adds
# labels (never removes or re-triggers on edits), and posts one reply.

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: Reply and Label the Issue
    permissions:
      issues: write
    runs-on: terraform-ci-policy
    timeout-minutes: 3
    steps:
      - name: Triage the issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue || !Number.isSafeInteger(issue.number) || issue.number <= 0) {
              throw new Error("Invalid issue metadata.");
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = issue.number;
            const title = issue.title || "";
            const body = issue.body || "";
            const text = `${title}\n${body}`;

            // ---- Kind labels ---------------------------------------------
            const kindLabels = [];
            // A crash word in the title is a strong enough signal; in the
            // body only panic-style evidence counts, where "crash" alone
            // is too generic.
            const crashEvidence =
              /\bcrash(es|ed)?\b/i.test(title) ||
              /\b(panic|crash\.log|goroutine \d+ \[|runtime error:)\b/i.test(body);
            if (crashEvidence) {
              kindLabels.push("crash");
            }
            if (/\b(feature request|add (a )?new (resource|data source)|support (a )?new |enhancement)\b/i.test(title)) {
              kindLabels.push("enhancement");
            } else if (/\b(documentation|docs?)\b/i.test(title)) {
              kindLabels.push("documentation");
            } else if (/^(how (do|can|to)|is (it|there))|question\b/i.test(title)) {
              kindLabels.push("question");
            }

            // ---- Service labels ------------------------------------------
            // Terraform names carry the service as the first segment after
            // alicloud_ (alicloud_oss_bucket -> oss). Names without a
            // service segment (alicloud_instance) are skipped: the mapping
            // to a product label would be a guess.
            const resourceNames =
              text.match(/\balicloud_[a-z0-9]+(?:_[a-z0-9]+)*\b/gi) || [];
            const services = new Set();
            for (const name of resourceNames) {
              const segments = name.toLowerCase().split("_").slice(1);
              if (segments.length >= 2) {
                services.add(segments[0]);
              }
            }

            // Service segments whose product label exists under a different
            // name (same table as the pull request labeler).
            const serviceLabelAliases = {
              alidns: "DNS",
              apig: "API GW",
              cloudapi: "API GW",
              cloudfw: "cloudfirewall",
              db: "RDS",
              eipanycast: "EIP",
              log: "SLS",
              rkvstore: "KVStore",
              smartag: "SAG",
            };

            let serviceLabels = [];
            if (services.size > 0) {
              const repoLabels = await github.paginate(
                github.rest.issues.listLabelsForRepo,
                { owner, repo, per_page: 100 }
              );
              const labelByName = new Map(
                repoLabels.map(({ name }) => [name.toLowerCase(), name])
              );
              for (const service of services) {
                const labelName = serviceLabelAliases[service] || service;
                const label = labelByName.get(labelName.toLowerCase());
                if (label) {
                  serviceLabels.push(label);
                } else {
                  core.warning(
                    `No repository label matches service ${service}; label skipped.`
                  );
                }
              }
              // Keep the label set readable even for issues that touch
              // many products.
              serviceLabels = serviceLabels.slice(0, 5);
            }

            // ---- Current state on GitHub ---------------------------------
            const currentLabels = (
              await github.paginate(github.rest.issues.listLabelsOnIssue, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              })
            ).map(({ name }) => name);
            const hasLabel = (name) =>
              currentLabels.some((current) => current.toLowerCase() === name.toLowerCase());

            const labelsToAdd = [...kindLabels, ...serviceLabels].filter(
              (label) => !hasLabel(label)
            );
            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: labelsToAdd,
              });
              core.info(`Applied labels: ${labelsToAdd.join(", ")}.`);
            }

            // ---- Reply ---------------------------------------------------
            // One fixed short acknowledgment, mentioning the resource names
            // the reporter used. The marker guards against a manual re-run
            // of this workflow posting a duplicate comment.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const hasWelcome = comments.some(({ body: commentBody }) =>
              commentBody.includes("<!-- issue-triage:welcome -->")
            );

            if (!hasWelcome) {
              const mentioned = [...new Set(resourceNames.map((name) => name.toLowerCase()))]
                .slice(0, 3)
                .map((name) => `\`${name}\``);
              const resourceMention =
                mentioned.length > 0 ? ` on ${mentioned.join(", ")}` : "";
              // One template for every reply; only the closing hint
              // differs — questions get the community pointer, reports
              // the version/repro ask.
              const hint = kindLabels.includes("question")
                ? "For general usage questions, the [community channels](https://www.terraform.io/community.html) also answer quickly."
                : "If not already included, the provider version and a minimal reproducible configuration help us move faster.";
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: [
                  "<!-- issue-triage:welcome -->",
                  `Thanks for reaching out${resourceMention} — we'll follow up here. ${hint}`,
                ].join("\n"),
              });
            }
