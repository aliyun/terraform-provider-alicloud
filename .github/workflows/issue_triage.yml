name: Issue Triage

# Automatic labeling plus exactly one fixed acknowledgment, posted when
# the issue is opened and never rewritten. Labels are additive and idempotent
# (nothing is ever removed). The reply is deliberately constant: naming the
# resources scraped out of the report is misleading (an issue usually cites
# unrelated resources), and asking for details duplicates the issue template.

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: Reply and Label the Issue
    permissions:
      issues: write
    runs-on: terraform-ci-policy
    timeout-minutes: 3
    steps:
      - name: Triage the issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue || !Number.isSafeInteger(issue.number) || issue.number <= 0) {
              throw new Error("Invalid issue metadata.");
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = issue.number;
            const title = issue.title || "";
            const body = issue.body || "";
            const text = `${title}\n${body}`;

            // ---- Kind labels ---------------------------------------------
            // Exactly one kind drives the reply wording. Crash is additive
            // because it describes severity rather than the request, so it
            // never replaces the kind label. Feature detection has to cover
            // the phrasings this repo actually receives: a bare
            // "Support <capability>" title is a feature request even when
            // the word "new" never appears.
            const featureEvidence =
              /\b(feature request|enhancement|new resource|new data source)\b/i.test(text) ||
              /\bterraform support (for|of)\b/i.test(title) ||
              /:\s*(support|add|allow|enable|provide|expose)\b/i.test(title) ||
              /^(please )?(add|adding|support|supporting|allow|allowing|provide|providing|enable|enabling|expose|introduce|consider)\b/i.test(title);
            const docsEvidence = /\b(docs?|documentation)\b/i.test(title);
            // A crash word in the title is a strong enough signal. In the
            // body it takes Terraform's own crash shape — a panic line
            // followed by a goroutine dump — because a pasted log from an
            // unrelated program also contains "panic:".
            const crashEvidence =
              /\bcrash(es|ed)?\b/i.test(title) ||
              /\bcrash\.log\b/i.test(body) ||
              /\bpanic:[^\n]*\n[\s\S]{0,4000}?\bgoroutine \d+ \[/i.test(body);
            // Failure vocabulary is split: on the title it is strong, in the
            // body it is weak, because a question that pastes a log owns
            // none of the words inside it.
            const failurePattern =
              /\b(bug|errors?|fail(s|ed|ing|ure)?|panics?|crash(es|ed)?|regression|incorrect(ly)?|wrong|broken|missing|drift(s|ed|ing)?|mismatch(es)?|inconsistent|stale|ignore[sd]?|repeat(s|ed|ing)?|duplicat(e|es|ed)|leaks?|does not|doesn't|not (work(s|ing)?|sent|applied|persisted|updated|returned)|never (sent|updated|applied)|unexpected(ly)?|timeouts?|denied|throttl(ed|ing)|exceeds?)\b/i;
            const titleFailureEvidence = failurePattern.test(title);
            const bodyFailureEvidence = failurePattern.test(body);
            const questionEvidence =
              /^(how|what|why|when|which|where|is (it|there)|are (there|they)|can (i|we)|does)\b/i.test(title) ||
              /\bquestions?\b/i.test(title);

            let kind = null;
            if (crashEvidence) {
              kind = "crash";
            } else if (featureEvidence) {
              kind = "enhancement";
            } else if (docsEvidence) {
              kind = "documentation";
            } else if (titleFailureEvidence) {
              kind = "bug";
            } else if (questionEvidence) {
              kind = "question";
            } else if (bodyFailureEvidence) {
              kind = "bug";
            }

            const kindLabels = [];
            if (crashEvidence) {
              kindLabels.push("crash");
            }
            if (kind && kind !== "crash") {
              kindLabels.push(kind);
            }

            // ---- Service labels ------------------------------------------
            // Only template-shaped mentions attribute a product to the
            // report; a name that appears in prose (a cited issue, a quoted
            // log) is not evidence. Issue #11530 declares alicloud_eip_address
            // but its References section also names alicloud_cen_bandwidth_package.
            // The Affected Resource(s) section is authoritative when present;
            // otherwise only bulleted names and HCL resource/data declarations
            // count, never the surrounding prose. The title always counts,
            // because a title names the subject rather than a citation.
            const affectedHeading = /^#{1,6}\s+.*affected resources?.*$/im.exec(body);
            let affectedSection = null;
            if (affectedHeading) {
              const rest = body.slice(affectedHeading.index + affectedHeading[0].length);
              const nextHeading = /^#{1,6}\s+/m.exec(rest);
              affectedSection = nextHeading ? rest.slice(0, nextHeading.index) : rest;
            }
            const declaredLines = body
              .split("\n")
              .filter((line) => /^\s*[-*+]\s/.test(line) || /\b(?:resource|data)\s+"alicloud_/i.test(line))
              .join("\n");
            const resourceText = `${title}\n${affectedSection !== null ? affectedSection : declaredLines}`;
            // Terraform names carry the service as the first segment after
            // alicloud_ (alicloud_oss_bucket -> oss). Names without a
            // service segment (alicloud_instance) are skipped: the mapping
            // to a product label would be a guess.
            const resourceNames =
              resourceText.match(/\balicloud_[a-z0-9]+(?:_[a-z0-9]+)*\b/gi) || [];
            const services = new Set();
            for (const name of resourceNames) {
              const segments = name.toLowerCase().split("_").slice(1);
              if (segments.length >= 2) {
                services.add(segments[0]);
              }
            }

            // Service segments whose product label exists under a different
            // name (same table as the pull request labeler).
            const serviceLabelAliases = {
              alidns: "DNS",
              apig: "API GW",
              cloudapi: "API GW",
              cloudfw: "cloudfirewall",
              db: "RDS",
              eipanycast: "EIP",
              log: "SLS",
              rkvstore: "KVStore",
              smartag: "SAG",
            };

            let serviceLabels = [];
            if (services.size > 0) {
              const repoLabels = await github.paginate(
                github.rest.issues.listLabelsForRepo,
                { owner, repo, per_page: 100 }
              );
              const labelByName = new Map(
                repoLabels.map(({ name }) => [name.toLowerCase(), name])
              );
              // Distinct resource names can resolve to the same product
              // label (alicloud_db_instance and alicloud_rds_* both mean
              // RDS), so dedupe on the resolved label rather than on the
              // service segment, or duplicates eat the cap below.
              const matchedLabels = new Map();
              for (const service of services) {
                const labelName = serviceLabelAliases[service] || service;
                const label = labelByName.get(labelName.toLowerCase());
                if (label) {
                  matchedLabels.set(label.toLowerCase(), label);
                } else {
                  core.warning(
                    `No repository label matches service ${service}; label skipped.`
                  );
                }
              }
              // Keep the label set readable even for issues that touch
              // many products.
              serviceLabels = [...matchedLabels.values()].slice(0, 5);
            }

            // ---- Current state on GitHub ---------------------------------
            const currentLabels = (
              await github.paginate(github.rest.issues.listLabelsOnIssue, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              })
            ).map(({ name }) => name);
            const hasLabel = (name) =>
              currentLabels.some((current) => current.toLowerCase() === name.toLowerCase());

            const labelsToAdd = [...kindLabels, ...serviceLabels].filter(
              (label) => !hasLabel(label)
            );
            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: labelsToAdd,
              });
              core.info(`Applied labels: ${labelsToAdd.join(", ")}.`);
            }

            // ---- Reply ---------------------------------------------------
            // One short acknowledgment, identical for every issue: labels
            // carry the classification, and the only extra context is where
            // usage questions get answered faster. The marker keeps a re-run
            // from posting a second copy; the comment is written once and
            // never edited afterwards.
            const marker = "<!-- issue-triage:welcome -->";

            // A first-time author gets one extra welcome line. Any earlier
            // issue or pull request by the same author suppresses it, and the
            // issue just opened is excluded from that history.
            const author = issue.user && issue.user.login;
            const welcome = [];
            if (author) {
              const history = await github.rest.issues.listForRepo({
                owner,
                repo,
                creator: author,
                state: "all",
                per_page: 2,
              });
              if (history.data.every((item) => item.number === issueNumber)) {
                welcome.push(
                  `Welcome @${author} — this is your first issue here, welcome to the community!`,
                  ""
                );
              }
            }

            const reply = [
              marker,
              ...welcome,
              "Thanks for taking the time to file this — we'll review it and follow up.",
              "",
              "For usage questions, see the [provider docs](https://registry.terraform.io/providers/aliyun/alicloud/latest/docs) and [community channels](https://www.terraform.io/community.html).",
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find(({ body: commentBody }) =>
              (commentBody || "").includes(marker)
            );

            if (existing) {
              core.info("Acknowledgment already posted; leaving it untouched.");
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: reply,
              });
            }
