name: Terrafrom Basic Checks
on:
  # Fork workflow changes require repository approval before this workflow can
  # run. Never approve an external protected-path change when Basic Policy fails.
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - master

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  route:
    permissions:
      checks: read
      pull-requests: read
    # API-only discovery has its own restricted pool, separate from Gate workers.
    runs-on: terraform-ci-route
    timeout-minutes: 5
    outputs:
      classification: ${{ steps.select.outputs.classification }}
      relevant: ${{ steps.select.outputs.relevant }}
      runner: ${{ steps.select.outputs.runner }}
    steps:
      - name: Wait for Basic Policy
        id: select
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const policyVersion = 1;
            const supportedActions = new Set([
              "opened",
              "reopened",
              "synchronize",
              "ready_for_review",
            ]);
            const supportedBaseRefs = new Set(["master"]);
            const actionsApp = {
              id: 15368,
              slug: "github-actions",
              name: "GitHub Actions",
              owner: "github",
            };
            const pullRequest = context.payload.pull_request;
            const headRepository = pullRequest?.head?.repo?.full_name;
            const headSha = pullRequest?.head?.sha;
            const baseRepository = pullRequest?.base?.repo?.full_name;
            const baseRef = pullRequest?.base?.ref;
            const pullNumber = pullRequest?.number;
            const expectedBaseRepository = `${context.repo.owner}/${context.repo.repo}`;
            const expectedOrigin = new URL(context.serverUrl).origin;
            const repositoryPattern =
              /^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})\/[A-Za-z0-9._-]{1,100}$/;

            if (
              context.eventName !== "pull_request" ||
              !supportedActions.has(context.payload.action) ||
              typeof headRepository !== "string" ||
              !repositoryPattern.test(headRepository) ||
              !/^[0-9a-f]{40}$/.test(headSha ?? "") ||
              baseRepository !== expectedBaseRepository ||
              typeof baseRef !== "string" ||
              !supportedBaseRefs.has(baseRef) ||
              !Number.isSafeInteger(pullNumber) ||
              pullNumber <= 0
            ) {
              throw new Error("Pull request metadata is invalid.");
            }

            const parseBinding = (externalId) => {
              if (typeof externalId !== "string" || externalId.length > 255) {
                throw new Error("Basic Policy binding is invalid.");
              }
              let binding;
              try {
                binding = JSON.parse(externalId);
              } catch {
                throw new Error("Basic Policy binding is invalid.");
              }
              if (
                binding === null ||
                typeof binding !== "object" ||
                Array.isArray(binding) ||
                Object.keys(binding).sort().join(",") !== "c,p,q,r,s,v" ||
                binding.v !== policyVersion ||
                binding.p !== pullNumber ||
                binding.s !== headSha ||
                binding.r !== headRepository ||
                !["trusted", "external", "blocked", "invalid"].includes(
                  binding.c
                ) ||
                typeof binding.q !== "boolean"
              ) {
                throw new Error("Basic Policy binding is stale or invalid.");
              }
              return binding;
            };

            const validateSource = (check) => {
              const checkId = check?.id;
              const canonicalCheckUrl =
                `${expectedOrigin}/${context.repo.owner}/${context.repo.repo}` +
                `/runs/${checkId}`;
              if (
                !Number.isSafeInteger(checkId) ||
                checkId <= 0 ||
                check?.app?.id !== actionsApp.id ||
                check?.app?.slug !== actionsApp.slug ||
                check?.app?.name !== actionsApp.name ||
                check?.app?.owner?.login !== actionsApp.owner ||
                check?.details_url !== canonicalCheckUrl ||
                check?.html_url !== canonicalCheckUrl
              ) {
                throw new Error("Basic Policy Check Run source is invalid.");
              }
            };

            const delay = (milliseconds) =>
              new Promise((resolve) => setTimeout(resolve, milliseconds));
            // The Basic Policy Gate runs on pull_request_target in a separate
            // workflow that queues on the shared terraform-ci-policy runner
            // pool independently of this route job. Under runner contention the
            // Gate's Check Run can appear after this job has started. The
            // discovery budget tolerates that queue delay; the completion
            // budget only starts once a unique Check Run is observable, so a
            // slow-to-appear but already-completed policy is not penalised by
            // this job's own start. Worst case 150s + 30s = 180s, within the
            // 300s (timeout-minutes: 5) route job budget.
            const discoveryTimeoutMs = 150000;
            const completionTimeoutMs = 30000;
            const pollIntervalMs = 3000;
            const discoveryDeadline = Date.now() + discoveryTimeoutMs;
            let completionDeadline = null;
            let observed = false;

            while (true) {
              const deadline = observed ? completionDeadline : discoveryDeadline;
              if (Date.now() >= deadline) {
                throw new Error(
                  observed
                    ? "Timed out waiting for a unique Basic Policy result."
                    : "Timed out waiting for a Basic Policy Check Run to appear."
                );
              }

              const checkRuns = await github.paginate(
                github.rest.checks.listForRef,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: headSha,
                  check_name: "Basic Policy",
                  filter: "all",
                  per_page: 100,
                }
              );
              const candidates = checkRuns.filter(
                (check) =>
                  check?.name === "Basic Policy" && check?.head_sha === headSha
              );

              if (candidates.length === 0) {
                await delay(Math.min(pollIntervalMs, Math.max(0, deadline - Date.now())));
                continue;
              }
              if (candidates.length !== 1) {
                throw new Error("Basic Policy Check Run is ambiguous.");
              }

              const check = candidates[0];
              validateSource(check);
              const binding = parseBinding(check.external_id);
              if (!observed) {
                observed = true;
                completionDeadline = Date.now() + completionTimeoutMs;
              }

              if (check.status !== "completed") {
                if (!["queued", "in_progress"].includes(check.status)) {
                  throw new Error("Basic Policy Check Run status is invalid.");
                }
                await delay(Math.min(pollIntervalMs, Math.max(0, completionDeadline - Date.now())));
                continue;
              }
              if (check.conclusion !== "success") {
                throw new Error("Basic Policy rejected this pull request.");
              }
              if (!["trusted", "external"].includes(binding.c)) {
                throw new Error("Basic Policy classification is not executable.");
              }

              const runner =
                binding.c === "trusted"
                  ? JSON.stringify("terraform-ci-trusted")
                  : JSON.stringify("ubuntu-latest");
              core.setOutput("classification", binding.c);
              core.setOutput("relevant", String(binding.q));
              core.setOutput("runner", runner);
              return;
            }

  TestFrameworkGuard:
    needs: route
    # The test line runs terraform-plugin-testing since the flip: no file,
    # test or not, may newly import the SDK v2 helper/resource package
    # (non-test code uses helper/retry, tests use the plugin-testing harness).
    if: ${{ needs.route.outputs.relevant == 'true' }}
    permissions:
      contents: read
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve change range
        id: change-range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CI_BASE_REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: scripts/ci/resolve-change-range.sh >> "$GITHUB_OUTPUT"
      - name: Reject new SDK v2 helper/resource imports
        env:
          DIFF_BASE: ${{ steps.change-range.outputs.diff_base }}
          DIFF_HEAD: ${{ steps.change-range.outputs.diff_head }}
        run: bash scripts/ci/test-framework-guard.sh

  BreakingChange:
    needs: route
    if: ${{ needs.route.outputs.relevant == 'true' }}
    permissions:
      contents: read
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          # Checkout as many commits as needed for the diff
          fetch-depth: 0
      - name: Resolve change range
        id: change-range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CI_BASE_REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: scripts/ci/resolve-change-range.sh >> "$GITHUB_OUTPUT"
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Attribute Breaking Change Check
        env:
          DIFF_BASE: ${{ steps.change-range.outputs.diff_base }}
          DIFF_HEAD: ${{ steps.change-range.outputs.diff_head }}
        run: |
          if [[ -f scripts/ci/run-provider-check.py && -f scripts/ci/check_scope.py ]]; then
            python3 scripts/ci/run-provider-check.py breaking
          else
            git diff "$DIFF_BASE" "$DIFF_HEAD" > diff.out
            go run scripts/compatibility/breaking_change_check.go -fileNames="diff.out"
          fi

  Formatter:
    needs: route
    if: ${{ needs.route.outputs.relevant == 'true' }}
    permissions:
      contents: read
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          # Checkout as many commits as needed for the diff
          fetch-depth: 0
      - name: Resolve change range
        id: change-range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CI_BASE_REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: scripts/ci/resolve-change-range.sh >> "$GITHUB_OUTPUT"
      - name: Set up Go Version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Install formatter
        run: go install golang.org/x/tools/cmd/goimports@v0.24.0
      - name: Golang Formatter Check
        env:
          DIFF_BASE: ${{ steps.change-range.outputs.diff_base }}
          DIFF_HEAD: ${{ steps.change-range.outputs.diff_head }}
        run: |
          if [[ -f scripts/ci/run-format-check.py && -f scripts/ci/check_scope.py ]]; then
            python3 scripts/ci/run-format-check.py
          else
            status=0
            git diff --name-only -z --no-renames --diff-filter=ACM "$DIFF_BASE" "$DIFF_HEAD" -- 'alicloud/*.go' 'alicloud/**/*.go' > "$RUNNER_TEMP/format-files"
            while IFS= read -r -d '' path; do
              [[ -f "$path" ]] || continue
              for tool in gofmt goimports; do
                output="$("$tool" -l "$path")"
                if [[ -n "$output" ]]; then
                  "$tool" -d "$path"
                  status=1
                fi
              done
            done < "$RUNNER_TEMP/format-files"
            exit "$status"
          fi


  Compile:
    needs: route
    if: ${{ needs.route.outputs.relevant == 'true' }}
    permissions:
      contents: read
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          # Checkout as many commits as needed for the diff
          fetch-depth: 0
      - name: Resolve change range
        id: change-range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CI_BASE_REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: scripts/ci/resolve-change-range.sh >> "$GITHUB_OUTPUT"
      - name: Set up Go Version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Restore node-local Go cache
        id: local-go-cache
        if: ${{ needs.route.outputs.classification == 'trusted' }}
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Older PR heads may lack the helper. Use their exact base fixture.
          helper=scripts/ci/restore-local-go-cache.py
          if [[ ! -f "$helper" && "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            helper="$RUNNER_TEMP/restore-local-go-cache.py"
            if ! git show "$PR_BASE_SHA:scripts/ci/restore-local-go-cache.py" > "$helper"; then
              rm -f "$helper"
            fi
          fi
          # The administrator helper is read-only and still validates checkout hashes.
          if [[ ! -s "$helper" && -f /opt/terraform-ci-cache/restore.py ]]; then
            helper=/opt/terraform-ci-cache/restore.py
          fi
          if [[ -s "$helper" ]]; then
            python3 "$helper"
          else
            echo 'hit=false' >> "$GITHUB_OUTPUT"
          fi
      - name: vet
        env:
          DIFF_BASE: ${{ steps.change-range.outputs.diff_base }}
          DIFF_HEAD: ${{ steps.change-range.outputs.diff_head }}
        run: |
          if [[ -f scripts/ci/run-vet-check.py && -f scripts/ci/check_scope.py ]]; then
            python3 scripts/ci/run-vet-check.py
          else
            CI_CHECK_BASE="$DIFF_BASE" ./scripts/vetcheck.sh
          fi

  BuildInputs:
    needs: route
    # Detect whether the change range touches build-input files (CI workflows,
    # GNUmakefile, CI/check scripts). Product-Go PRs reach ProductionBuild via
    # route.outputs.relevant; this detector adds the CI/Make/script path so a
    # base CI/Make/script PR itself is covered instead of being skipped as not
    # relevant. Fixture-tested by scripts/ci/detect-build-input-changes_test.sh.
    if: ${{ always() && needs.route.result == 'success' }}
    permissions:
      contents: read
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve change range
        id: change-range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CI_BASE_REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: scripts/ci/resolve-change-range.sh >> "$GITHUB_OUTPUT"
      - name: Detect build-input changes
        id: detect
        env:
          DIFF_BASE: ${{ steps.change-range.outputs.diff_base }}
          DIFF_HEAD: ${{ steps.change-range.outputs.diff_head }}
        run: |
          value="$(scripts/ci/detect-build-input-changes.sh)"
          echo "changed=$value" >> "$GITHUB_OUTPUT"

  ProductionBuild:
    needs: [route, BuildInputs]
    # Real production build of the root provider main + complete production
    # dependency graph assertion. Complements the Compile job (which runs only
    # `vet`) with a genuine `go build`/link (root main + transitive production
    # deps, including the alicloud/service/* subpackages) and a `go list -deps`
    # graph query that blocks terraform-plugin-sdk/v2/helper/resource from the
    # production link graph. Runs for product-Go PRs (route relevant) and for
    # build-input PRs (CI/Make/scripts); reusable by every product migration PR.
    if: ${{ needs.route.outputs.relevant == 'true' || needs.BuildInputs.outputs.changed == 'true' }}
    permissions:
      contents: read
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go Version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Restore node-local Go cache
        id: local-go-cache
        if: ${{ needs.route.outputs.classification == 'trusted' }}
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Older PR heads may lack the helper. Use their exact base fixture.
          helper=scripts/ci/restore-local-go-cache.py
          if [[ ! -f "$helper" && "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            helper="$RUNNER_TEMP/restore-local-go-cache.py"
            if ! git show "$PR_BASE_SHA:scripts/ci/restore-local-go-cache.py" > "$helper"; then
              rm -f "$helper"
            fi
          fi
          # The administrator helper is read-only and still validates checkout hashes.
          if [[ ! -s "$helper" && -f /opt/terraform-ci-cache/restore.py ]]; then
            helper=/opt/terraform-ci-cache/restore.py
          fi
          if [[ -s "$helper" ]]; then
            python3 "$helper"
          else
            echo 'hit=false' >> "$GITHUB_OUTPUT"
          fi
      # Call the underlying commands directly instead of `make provider-build` /
      # `make check-production-deps`: the route runner for a fork PR can be
      # `ubuntu-latest`, where `make` is not guaranteed to be on PATH. The make
      # targets remain the canonical local/FC entry; CI mirrors the existing
      # `Compile`/`Formatter` jobs, which call scripts/go tools directly.
      - name: Build root provider main (production)
        run: go build -o /dev/null .
      - name: Production dependency graph check (no SDK v2 helper/resource)
        run: scripts/ci/check-production-deps.sh

