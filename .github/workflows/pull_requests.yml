name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - master

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Pull Request Title
    permissions:
      contents: read
    # The gate runs go-run checker code from the pull request head with no
    # secrets, so it runs where untrusted code belongs; the route action
    # supports opened/reopened/synchronize/ready_for_review only, and this
    # workflow must also re-run on edited title fixes.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve change range
        id: change-range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CI_BASE_REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: scripts/ci/resolve-change-range.sh >> "$GITHUB_OUTPUT"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Checking the title info
        # The title entries are derived from the provider.go registration
        # join, not from flat filenames: a shared plumbing file implements
        # no registered entity and demands nothing, and a file registered
        # under a different TypeName demands its registered name.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          DIFF_BASE: ${{ steps.change-range.outputs.diff_base }}
          DIFF_HEAD: ${{ steps.change-range.outputs.diff_head }}
        run: |
          git diff "$DIFF_BASE" "$DIFF_HEAD" > diff.out
          go run scripts/title/title_check.go -fileNames="diff.out" -title="$PR_TITLE"

  commits:
    name: Pull Request Max Commits
    permissions: {}
    runs-on: terraform-ci-policy
    timeout-minutes: 3
    steps:
      - name: Checking the max commits number
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const commitNum = context.payload.pull_request?.commits;
            if (!Number.isSafeInteger(commitNum) || commitNum < 0) {
              throw new Error("Invalid pull request commit metadata.");
            }
            if (commitNum > 1) {
              core.setFailed(
                `The PR has ${commitNum} commits, and please rebase it to 1.`
              );
            }
