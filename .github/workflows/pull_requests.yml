name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - master

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Pull Request Title
    permissions:
      contents: read
    # The title entries are derived from the register.go registration join
    # (scripts/title/title_check.go), not from filenames: a service
    # implementation stem names no entity on its own, and a migration into
    # the split layout announces the modified form. The checker, its
    # resolver and the change-range script are restored from the pull
    # request base, so master's code judges the pull request data and the
    # pull request reaches this runner as git objects and parsed files
    # only, never as executed code; the route action supports
    # opened/reopened/synchronize/ready_for_review only, and this workflow
    # must also re-run on edited title fixes, so the job runs directly
    # instead of routed.
    runs-on: terraform-ci-policy
    timeout-minutes: 10
    steps:
      - name: Check out event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Fetch the pull request base
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CI_BASE_REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          # Keep base-only checker blobs available for lazy git checkout.
          git config --local --replace-all remote.ci-base.url "$CI_BASE_REPOSITORY_URL"
          git config --local remote.ci-base.promisor true
          git config --local remote.ci-base.partialclonefilter blob:none
          git fetch --no-tags --no-recurse-submodules --force --filter=blob:none \
            ci-base \
            "+refs/heads/$PR_BASE_REF:refs/remotes/ci-base/base"
      - name: Restore the title checker from the pull request base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "${PR_BASE_SHA}:scripts/title/title_check.go" 2>/dev/null; then
            git checkout "${PR_BASE_SHA}" -- scripts/ci scripts/title scripts/internal/splitlayout
          fi
          # Without that path at the base, only the pull request that
          # introduces the checker can be here: it runs the copy it adds,
          # under review.
      - name: Resolve change range
        id: change-range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CI_BASE_REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: scripts/ci/resolve-change-range.sh >> "$GITHUB_OUTPUT"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Checking the title info
        # The checker imports only the standard library and the in-module
        # splitlayout package, so it runs hermetically with the module
        # proxy disabled.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          DIFF_BASE: ${{ steps.change-range.outputs.diff_base }}
          DIFF_HEAD: ${{ steps.change-range.outputs.diff_head }}
        run: |
          GOWORK=off GOTOOLCHAIN=local GOPROXY=off go run scripts/title/title_check.go -title="$PR_TITLE" -base="$DIFF_BASE" -head="$DIFF_HEAD"

  commits:
    name: Pull Request Max Commits
    permissions: {}
    runs-on: terraform-ci-policy
    timeout-minutes: 3
    steps:
      - name: Checking the max commits number
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const commitNum = context.payload.pull_request?.commits;
            if (!Number.isSafeInteger(commitNum) || commitNum < 0) {
              throw new Error("Invalid pull request commit metadata.");
            }
            if (commitNum > 1) {
              core.setFailed(
                `The PR has ${commitNum} commits, and please rebase it to 1.`
              );
            }
