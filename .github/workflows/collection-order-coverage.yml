name: TypeList Order Coverage
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - master
    paths:
      - scripts/ci/check_scope.py
      - scripts/ci/run-provider-check.py
      - scripts/ci/test_check_scope.py
      - scripts/internal/**
      - go.mod
      - go.sum
      - .github/workflows/collection-order-coverage.yml
      - scripts/collection-order/**
      - scripts/ci/resolve-change-range.sh
      - .go-version
      - alicloud/*.go
      - alicloud/service/**/*.go
      - alicloud/provider/core/*.go

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    permissions:
      checks: read
      pull-requests: read
    # API-only discovery has its own restricted pool, separate from Gate workers.
    runs-on: terraform-ci-route
    timeout-minutes: 5
    outputs:
      classification: ${{ steps.select.outputs.classification }}
      runner: ${{ steps.select.outputs.runner }}
    steps:
      - name: Select runner
        id: select
        uses: aliyun/terraform-provider-alicloud/.github/actions/terraform-ci-select-policy@79a5112c3e23e113cb92f33f1683d09929c0b69e

  TypeListOrderCoverage:
    needs: route
    timeout-minutes: 30
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    permissions:
      contents: read
    steps:
      - name: Check out event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Resolve change range
        id: change-range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          CI_BASE_REPOSITORY_URL: https://github.com/${{ github.repository }}.git
          CI_BASE_REF: ${{ github.ref_name }}
        run: scripts/ci/resolve-change-range.sh >> "$GITHUB_OUTPUT"
      - name: Restore coverage checker for older pull requests
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DIFF_BASE: ${{ steps.change-range.outputs.diff_base }}
          DIFF_HEAD: ${{ steps.change-range.outputs.diff_head }}
        run: |
          set -euo pipefail
          if git cat-file -e "$DIFF_HEAD:scripts/collection-order" 2>/dev/null; then
            exit 0
          fi
          if ! git diff --quiet "$DIFF_BASE" "$DIFF_HEAD" -- scripts/collection-order; then
            echo "::error::This pull request removes the TypeList Order Coverage checker."
            exit 1
          fi
          git archive "$PR_BASE_SHA" scripts/collection-order | tar -x
      - name: Prepare writable Go/tool cache
        # Route A: keep node-local Go/tool caches when the default HOME-owned
        # directories are writable; redirect only the unwritable ones to a
        # per-job $RUNNER_TEMP subdir so a polluted /home/runner on the trusted
        # fleet no longer causes EACCES in setup-go/goimports/golangci-lint/
        # the node-local seed restore or the coverage `go test`/`go run`. Runs
        # before setup-go so the env it exports is in effect throughout.
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_BASE_REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: |
          # Older PR checkouts may predate this helper. Keep legacy tool paths
          # defined, then prefer the PR helper or its exact, validated base SHA.
          echo "TF_CI_TOOLS_DIR=${TF_CI_TOOLS_DIR:-$HOME/.cache/terraform-ci-tools}" >> "$GITHUB_ENV"
          echo "TF_DOC_TOOLS_DIR=${TF_DOC_TOOLS_DIR:-$HOME/.cache/terraform-doc-tools}" >> "$GITHUB_ENV"
          helper=scripts/ci/ensure-writable-go-cache.sh
          if [[ ! -s "$helper" && "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            helper="$RUNNER_TEMP/ensure-writable-go-cache.sh"
            if ! git show "$PR_BASE_SHA:scripts/ci/ensure-writable-go-cache.sh" > "$helper" 2>/dev/null; then
              git config --local --replace-all remote.ci-base.url "$CI_BASE_REPOSITORY_URL"
              git config --local remote.ci-base.promisor true
              git config --local remote.ci-base.partialclonefilter blob:none
              if ! git fetch --no-tags --no-recurse-submodules --filter=blob:none ci-base "$PR_BASE_SHA" ||
                 ! git show "$PR_BASE_SHA:scripts/ci/ensure-writable-go-cache.sh" > "$helper"; then
                rm -f "$helper"
              fi
            fi
          fi
          if [[ -s "$helper" ]]; then
            bash "$helper"
          else
            echo '::notice::Writable-cache helper unavailable; using runner defaults.'
          fi
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Restore node-local Go cache
        id: local-go-cache
        if: ${{ needs.route.outputs.classification == 'trusted' }}
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Older PR heads may lack the helper. Use their exact base fixture.
          helper=scripts/ci/restore-local-go-cache.py
          if [[ ! -f "$helper" && "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            helper="$RUNNER_TEMP/restore-local-go-cache.py"
            if ! git show "$PR_BASE_SHA:scripts/ci/restore-local-go-cache.py" > "$helper"; then
              rm -f "$helper"
            fi
          fi
          # The administrator helper is read-only and still validates checkout hashes.
          if [[ ! -s "$helper" && -f /opt/terraform-ci-cache/restore.py ]]; then
            helper=/opt/terraform-ci-cache/restore.py
          fi
          if [[ -s "$helper" ]]; then
            python3 "$helper"
          else
            echo 'hit=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve Go cache paths
        id: go-cache
        shell: bash
        run: |
          # Go rehydrates module sources from these verified downloads.
          # Do not transfer both the zip files and their expanded copies.
          echo "module=$(go env GOMODCACHE)/cache/download" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore trusted Go cache
        if: ${{ needs.route.outputs.classification == 'trusted' && steps.local-go-cache.outputs.hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.module }}
            ${{ steps.go-cache.outputs.build }}
          key: provider-go-download-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version') }}-${{ hashFiles('go.mod', 'go.sum') }}
      - name: Test coverage checker
        run: go test ./scripts/collection-order/internal/coverage
      - name: Require TypeList reorder and convergence acceptance coverage
        env:
          DIFF_BASE: ${{ steps.change-range.outputs.diff_base }}
          DIFF_HEAD: ${{ steps.change-range.outputs.diff_head }}
        run: |
          if [[ -f scripts/ci/run-provider-check.py && -f scripts/ci/check_scope.py ]]; then
            python3 scripts/ci/run-provider-check.py collection
          else
            go run ./scripts/collection-order -base="$DIFF_BASE" -head="$DIFF_HEAD"
          fi
