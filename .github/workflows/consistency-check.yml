name: Terraform Consistency Check

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - master

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    permissions:
      checks: read
      pull-requests: read
    # API-only discovery has its own restricted pool, separate from Gate workers.
    runs-on: terraform-ci-route
    timeout-minutes: 5
    outputs:
      classification: ${{ steps.select.outputs.classification }}
      relevant: ${{ steps.select.outputs.relevant }}
      heavy_runner: ${{ steps.select.outputs.heavy_runner }}
    steps:
      - name: Select runner
        id: select
        uses: aliyun/terraform-provider-alicloud/.github/actions/terraform-ci-select-policy@79a5112c3e23e113cb92f33f1683d09929c0b69e

  consistency:
    name: Consistency
    needs: route
    # The docs-vs-schema check only applies to provider code; CI-only and
    # tooling-only diffs leave it vacuous, so skip them instead of queueing a
    # heavy runner.
    if: ${{ needs.route.outputs.relevant == 'true' }}
    runs-on: ${{ fromJSON(needs.route.outputs.heavy_runner) }}
    permissions:
      contents: read
    steps:
      - name: Check out event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Resolve change range
        id: change-range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          CI_BASE_REPOSITORY_URL: https://github.com/${{ github.repository }}.git
          CI_BASE_REF: ${{ github.ref_name }}
        run: scripts/ci/resolve-change-range.sh >> "$GITHUB_OUTPUT"
      - name: Test CI change scopes
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DIFF_BASE: ${{ steps.change-range.outputs.diff_base }}
          DIFF_HEAD: ${{ steps.change-range.outputs.diff_head }}
        run: |
          # Resolve change range first: its exact base and merge base are validated.
          helper=scripts/ci/run-ci-fixtures.py
          if [[ ! -s "$helper" ]]; then
            [[ "$GITHUB_EVENT_NAME" == pull_request && "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            helper="$RUNNER_TEMP/run-ci-fixtures.py"
            git show "$PR_BASE_SHA:scripts/ci/run-ci-fixtures.py" > "$helper"
          fi
          python3 "$helper" scope
      - name: Prepare writable Go/tool cache
        # Route A: keep caches when HOME-owned defaults are writable; redirect
        # only the unwritable ones to a per-job $RUNNER_TEMP subdir so a polluted
        # /home/runner on the trusted fleet no longer causes EACCES in setup-go,
        # the node-local seed restore, consistency_check or the master tfproviderlint
        # build. Runs before setup-go so the env it exports is in effect throughout.
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_BASE_REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: |
          # Older PR checkouts may predate this helper. Keep legacy tool paths
          # defined, then prefer the PR helper or its exact, validated base SHA.
          echo "TF_CI_TOOLS_DIR=${TF_CI_TOOLS_DIR:-$HOME/.cache/terraform-ci-tools}" >> "$GITHUB_ENV"
          echo "TF_DOC_TOOLS_DIR=${TF_DOC_TOOLS_DIR:-$HOME/.cache/terraform-doc-tools}" >> "$GITHUB_ENV"
          helper=scripts/ci/ensure-writable-go-cache.sh
          if [[ ! -s "$helper" && "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            helper="$RUNNER_TEMP/ensure-writable-go-cache.sh"
            if ! git show "$PR_BASE_SHA:scripts/ci/ensure-writable-go-cache.sh" > "$helper" 2>/dev/null; then
              git config --local --replace-all remote.ci-base.url "$CI_BASE_REPOSITORY_URL"
              git config --local remote.ci-base.promisor true
              git config --local remote.ci-base.partialclonefilter blob:none
              if ! git fetch --no-tags --no-recurse-submodules --filter=blob:none ci-base "$PR_BASE_SHA" ||
                 ! git show "$PR_BASE_SHA:scripts/ci/ensure-writable-go-cache.sh" > "$helper"; then
                rm -f "$helper"
              fi
            fi
          fi
          if [[ -s "$helper" ]]; then
            bash "$helper"
          else
            echo '::notice::Writable-cache helper unavailable; using runner defaults.'
          fi
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Test compact Go cache round trip
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DIFF_BASE: ${{ steps.change-range.outputs.diff_base }}
          DIFF_HEAD: ${{ steps.change-range.outputs.diff_head }}
        run: |
          set -euo pipefail
          test_root="$GITHUB_WORKSPACE"
          if [[ ! -f scripts/ci/test_go_cache.py ]]; then
            if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
              echo "::error::The Go cache regression test is missing."
              exit 1
            fi
            cache_inputs=(
              scripts/ci/test_go_cache.py
              .github/workflows/consistency-check.yml
              .github/workflows/testing-coverage-rate.yml
              .github/workflows/collection-order-coverage.yml
              .github/workflows/acctest-terraform-lint.yml
            )
            if ! git diff --quiet "$DIFF_BASE" "$DIFF_HEAD" -- "${cache_inputs[@]}"; then
              echo "::error::This PR changes cache validation inputs but lacks test_go_cache.py; update the branch from master."
              exit 1
            fi
            test_root="$(mktemp -d "$RUNNER_TEMP/go-cache-tests.XXXXXX")"
            trap 'rm -rf "$test_root"' EXIT
            echo "Using the PR base cache regression fixture for this older branch."
            git archive "$PR_BASE_SHA" -- "${cache_inputs[@]}" | tar -x -C "$test_root"
          fi
          python3 -m unittest discover -s "$test_root/scripts/ci" -p test_go_cache.py
      - name: Restore node-local Go cache
        id: local-go-cache
        if: ${{ needs.route.outputs.classification == 'trusted' }}
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Older PR heads may lack the helper. Use their exact base fixture.
          helper=scripts/ci/restore-local-go-cache.py
          if [[ ! -f "$helper" && "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            helper="$RUNNER_TEMP/restore-local-go-cache.py"
            if ! git show "$PR_BASE_SHA:scripts/ci/restore-local-go-cache.py" > "$helper"; then
              rm -f "$helper"
            fi
          fi
          # The administrator helper is read-only and still validates checkout hashes.
          if [[ ! -s "$helper" && -f /opt/terraform-ci-cache/restore.py ]]; then
            helper=/opt/terraform-ci-cache/restore.py
          fi
          if [[ -s "$helper" ]]; then
            python3 "$helper"
          else
            echo 'hit=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve Go cache paths
        id: go-cache
        shell: bash
        run: |
          # Go rehydrates module sources from these verified downloads.
          # Do not transfer both the zip files and their expanded copies.
          echo "module=$(go env GOMODCACHE)/cache/download" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore trusted Go cache
        if: ${{ needs.route.outputs.classification == 'trusted' && steps.local-go-cache.outputs.hit != 'true' }}
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.module }}
            ${{ steps.go-cache.outputs.build }}
          key: provider-go-download-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version') }}-${{ hashFiles('go.mod', 'go.sum') }}
      - name: Run consistency check
        env:
          DIFF_BASE: ${{ steps.change-range.outputs.diff_base }}
          DIFF_HEAD: ${{ steps.change-range.outputs.diff_head }}
        run: |
          if [[ -f scripts/ci/run-provider-check.py && -f scripts/ci/check_scope.py ]]; then
            python3 scripts/ci/run-provider-check.py consistency
          else
            git diff "$DIFF_BASE" "$DIFF_HEAD" > diff.out
            go run scripts/consistency/consistency_check.go -fileNames="diff.out"
          fi
      - name: Save master Go cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.route.outputs.classification == 'trusted' && steps.local-go-cache.outputs.hit != 'true' && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.module }}
            ${{ steps.go-cache.outputs.build }}
          key: provider-go-download-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version') }}-${{ hashFiles('go.mod', 'go.sum') }}
      - name: Restore master tfproviderlint binary
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.route.outputs.classification == 'trusted' }}
        id: tfproviderlint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_CI_TOOLS_DIR }}/tfproviderlint
          key: tfproviderlint-v2-${{ runner.os }}-${{ runner.arch }}-go1.26.10-v0.31.0
      - name: Build master tfproviderlint binary
        id: tfproviderlint-build
        continue-on-error: true
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.route.outputs.classification == 'trusted' && steps.tfproviderlint-cache.outputs.cache-hit != 'true' }}
        env:
          GOTOOLCHAIN: go1.26.10
          GOBIN: ${{ runner.temp }}/tfproviderlint-bin
        run: |
          mkdir -p "$GOBIN" "$TF_CI_TOOLS_DIR"
          go install github.com/bflad/tfproviderlint/cmd/tfproviderlint@v0.31.0
          cp "$GOBIN/tfproviderlint" "$TF_CI_TOOLS_DIR/tfproviderlint"
      - name: Save master tfproviderlint binary
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.route.outputs.classification == 'trusted' && steps.tfproviderlint-cache.outputs.cache-hit != 'true' && steps.tfproviderlint-build.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_CI_TOOLS_DIR }}/tfproviderlint
          key: tfproviderlint-v2-${{ runner.os }}-${{ runner.arch }}-go1.26.10-v0.31.0
