version: "2"
linters:
  settings:
    errcheck:
      exclude-functions:
        # Schema setter error returns only signal programming mistakes
        # (schema-type mismatch or unknown key), never API/runtime failure.
        # Both terraform-provider-aws (.ci/.golangci2.yml) and
        # terraform-provider-azurerm (.golangci.yml) exclude the same family.
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceData).Set
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceDiff).SetNew
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceDiff).SetNewComputed
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceDiff).ForceNew
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: scripts/
    paths:
      - examples
      - scripts
      - third_party$
      - builtin$
      - examples$
issues:
  new-from-rev: HEAD
  new: true
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
run:
  timeout: 10m