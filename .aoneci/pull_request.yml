name: Pull Request Checks

triggers:
  merge_request: {}

envs:
  PROVIDER_PINNED_TITLE: 'no'
  CODE_CI_SHALLOW_RANGE: '1'
  CODE_HEAD: '${{git.commitId}}'
  CODE_MR_ID: '${{git.merge_request.id ?: ""}}'
  CODE_MR_BASE: '${{git.merge_request.baseCommit ?: ""}}'
  CODE_PUSH_BEFORE: '${{git.push.beforeSha256 ?: ""}}'
  CODE_TARGET: '${{git.merge_request.targetBranch ?: ""}}'
  CODE_DEFAULT_BRANCH: '${{git.defaultBranch}}'
  CODE_MR_SOURCE_PROJECT: '${{git.merge_request.sourceProjectId ?: ""}}'
  CODE_MR_TARGET_PROJECT: '${{git.merge_request.targetProjectId ?: ""}}'
  CODE_MR_TITLE: '${{git.merge_request.title ?: ""}}'

jobs:
  title:
    steps:
      - uses: checkout
        inputs:
          fetch-depth: '32'
      - id: scope
        name: Determine whether title rules apply
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          result=0
          git diff --quiet --no-ext-diff "$DIFF_BASE" "$DIFF_HEAD" -- \
            ':(glob)scripts/ci/**' ':(glob)scripts/internal/**' ':(glob).aoneci/**' \
            go.mod go.sum ':(glob)website/docs/**' ':(glob)alicloud/**/*.go' || result=$?
          case "$result" in
            0) echo 'No files subject to Provider title rules changed. Pull Request Checks passed.'
               applicable=no ;;
            1) applicable=yes ;;
            *) exit "$result" ;;
          esac
          printf '%s' "$applicable" > "$AONE_CI_OUTPUTS/applicable"
      - name: Setup Go
        when: ${{ steps.scope.outputs.applicable == 'yes' }}
        uses: setup-env
        inputs:
          go-version: '1.25.8'
      - name: Checking the title info
        when: ${{ steps.scope.outputs.applicable == 'yes' }}
        # The title entries are derived from the register.go registration
        # join (scripts/title/title_check.go), not from filenames: a service
        # implementation stem names no entity on its own, and a migration
        # into the split layout announces the modified form. The checker and
        # its resolver are restored from the merge request base so master's
        # code judges the merge request data.
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          baseSha="$DIFF_BASE"
          headSha="$DIFF_HEAD"
          if [[ "${PROVIDER_PINNED_TITLE:-no}" != yes ]] && git cat-file -e "${baseSha}:scripts/title/title_check.go" 2>/dev/null; then
            git checkout "${baseSha}" -- scripts/title scripts/internal/splitlayout
          fi
          # Without that path at the base, only the merge request that
          # introduces the checker can be here: it runs the copy it adds,
          # under review.
          unset TITLE_RELEASE_CANDIDATE
          if [[ "$CODE_MR_TITLE" =~ ^Release\ sync:\ (v2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            ref="refs/heads/release-sync/${BASH_REMATCH[1]}"
            # A same-project MR into the default branch has the target repository as origin.
            test -n "$CODE_MR_TARGET_PROJECT" && test "$CODE_MR_TARGET_PROJECT" = "$CODE_MR_SOURCE_PROJECT" || exit 1
            test "$CODE_TARGET" = "$CODE_DEFAULT_BRANCH"
            record=$(git ls-remote --refs --exit-code origin "$ref")
            export TITLE_RELEASE_CANDIDATE="${record%%$'\t'*}"
          fi
          go run scripts/title/title_check.go -title="${CODE_MR_TITLE}" -base="${baseSha}" -head="${headSha}"
