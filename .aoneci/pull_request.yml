name: Pull Request Checks

triggers:
  push:
    paths:
      - 'website/docs/**'
      - 'alicloud/*.go'
      - 'alicloud/service/**/*.go'
  merge_request:
    types:
      - opened
    paths:
      - 'website/docs/**'
      - 'alicloud/*.go'
      - 'alicloud/service/**/*.go'

jobs:
  title:
    steps:
      - name: Setup Go
        uses: setup-env
        inputs:
          go-version: '1.24.0'
      - uses: checkout
        inputs:
          fetch-depth: '2'
      - name: Checking the title info
        # The title entries are derived from the register.go registration
        # join (scripts/title/title_check.go), not from filenames: a service
        # implementation stem names no entity on its own, and a migration
        # into the split layout announces the modified form. The checker and
        # its resolver are restored from the merge request base so master's
        # code judges the merge request data.
        run: |
          set -euo pipefail
          baseSha=$(git rev-parse --verify 'HEAD^')
          headSha=$(git rev-parse --verify 'HEAD')
          if git cat-file -e "${baseSha}:scripts/title/title_check.go" 2>/dev/null; then
            git checkout "${baseSha}" -- scripts/title scripts/internal/splitlayout
          fi
          # Without that path at the base, only the merge request that
          # introduces the checker can be here: it runs the copy it adds,
          # under review.
          go run scripts/title/title_check.go -title="${{git.merge_request.title}}" -base="${baseSha}" -head="${headSha}"

