name: Pull Request Checks

triggers:
  push:
    paths:
      - 'website/docs/**'
      - 'alicloud/*.go'
      - 'alicloud/service/**/*.go'
  merge_request:
    types:
      - opened
    paths:
      - 'website/docs/**'
      - 'alicloud/*.go'
      - 'alicloud/service/**/*.go'

jobs:
  title:
    steps:
      - name: Setup Go
        uses: setup-env
        inputs:
          go-version: '1.24.0'
      - uses: checkout
        inputs:
          fetch-depth: '2'
      - name: Checking the title info
        # The title entries are derived from the provider.go registration
        # join, not from flat filenames: a shared plumbing file implements
        # no registered entity and demands nothing, and a file registered
        # under a different TypeName demands its registered name.
        run: |
          git diff HEAD^ HEAD > diff.out
          go run scripts/title/title_check.go -fileNames="diff.out" -title="${{git.merge_request.title}}"

