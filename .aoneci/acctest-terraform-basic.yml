name: Terraform Basic Checks
triggers:
  merge_request:
    target-branches:
      - master
envs:
  VERIFIED_RELEASE_RETURN: >-
    ${{ pipeline.inst.triggerMode == 'MR' && git.merge_request.id != null &&
    git.repo == 'opensource-tools/terraform-provider-alicloud' &&
    git.merge_request.sourceProjectId != null && git.merge_request.sourceProjectId == git.merge_request.targetProjectId &&
    git.defaultBranch == 'master' && git.merge_request.targetBranch == git.defaultBranch &&
    secrets.PROVIDER_RELEASE_RETURN == 'v1:' + #string(git.merge_request.id) + ':' +
    git.merge_request.sourceBranch + ':' + git.merge_request.title + ':' + git.commitId ? 'yes' : 'no' }}
  CODE_CI_SHALLOW_RANGE: '1'
  CODE_HEAD: '${{git.commitId}}'
  CODE_MR_ID: '${{git.merge_request.id ?: ""}}'
  CODE_MR_BASE: '${{git.merge_request.baseCommit ?: ""}}'
  CODE_PUSH_BEFORE: '${{git.push.beforeSha256 ?: ""}}'
  CODE_TARGET: '${{git.merge_request.targetBranch ?: ""}}'
  CODE_DEFAULT_BRANCH: '${{git.defaultBranch}}'
  CODE_MR_TITLE: '${{git.merge_request.title ?: ""}}'

jobs:
  CheckScope:
    outputs:
      applicable: ${{ steps.scope.outputs.applicable }}
    steps:
      - name: Record release return exemption
        when: ${{ envs.VERIFIED_RELEASE_RETURN == 'yes' }}
        run: echo "Verified release return MR $CODE_MR_ID at $CODE_HEAD. Skipped ProviderLayout by policy."
      - uses: checkout
        inputs:
          fetch-depth: '32'
      - id: scope
        name: Check whether this pipeline applies
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          result=0
          git diff --quiet --no-ext-diff "$DIFF_BASE" "$DIFF_HEAD" -- \
            ':(glob)scripts/ci/**' \
            ':(glob)scripts/local-ci-check.sh' \
            ':(glob)scripts/vetcheck.sh' \
            ':(glob)scripts/gofmtcheck.sh' \
            ':(glob)scripts/goimportscheck.sh' \
            ':(glob)scripts/errcheck.sh' \
            ':(glob)scripts/compatibility/**' \
            ':(glob)scripts/title/**' \
            ':(glob)scripts/release/**' \
            ':(glob)scripts/internal/**' \
            ':(glob)GNUmakefile' \
            ':(glob)scripts/collection-order/**' \
            ':(glob)go.mod' \
            ':(glob)go.sum' \
            ':(glob).go-version' \
            ':(glob)**/*.go' \
            ':(glob).aoneci/**' || result=$?
          case "$result" in
            0)
              echo 'No files in scope; this check passes without running Go jobs.'
              printf '%s' no > "$AONE_CI_OUTPUTS/applicable"
              ;;
            1) printf '%s' yes > "$AONE_CI_OUTPUTS/applicable" ;;
            *) exit "$result" ;;
          esac
  PipelineSafety:
    needs: CheckScope
    when: ${{ jobs.CheckScope.outputs.applicable == 'yes' }}
    steps:
      - uses: checkout
      - uses: setup-env
        inputs:
          go-version: '1.25.8'
      - name: Range and release reconciliation regression
        run: |
          set -euo pipefail
          unset AONE_CI_SUMMARY_MD AONE_CI_SUMMARY
          python3 -m unittest discover -s scripts/ci -p test_aone_range.py
          python3 -m unittest discover -s scripts/ci -p test_acube_integration.py
          python3 -m unittest discover -s scripts/ci -p test_review_ci.py
          python3 -m unittest discover -s scripts/ci -p test_acube_layout.py
          python3 -m unittest discover -s scripts/ci -p test_aone_go_checks.py
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          bash scripts/ci/resolve-change-range_test.sh
          python3 -m unittest discover -s scripts/ci -p test_multi_commit_pr.py
          python3 -m unittest discover -s scripts/ci -p test_check_scope.py
          python3 -m unittest discover -s scripts/ci -p test_document_checks.py
          go test ./scripts/compatibility ./scripts/title
  ProviderLayout:
    needs: CheckScope
    when: ${{ jobs.CheckScope.outputs.applicable == 'yes' && envs.VERIFIED_RELEASE_RETURN != 'yes' }}
    steps:
      - uses: checkout
        inputs:
          fetch-depth: '32'
      - uses: setup-env
        inputs:
          go-version: '1.25.8'
      - name: Check new service file layout
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          GO111MODULE=off GOWORK=off go run scripts/ci/accscope/main.go scripts/ci/accscope/layout.go \
            -base "$DIFF_BASE" -head "$DIFF_HEAD" -layout-only
  BreakingChange:
    needs: CheckScope
    when: ${{ jobs.CheckScope.outputs.applicable == 'yes' }}
    steps:
      - name: Setup Go
        uses: setup-env
        inputs:
          go-version: '1.25.8'
      - uses: checkout
        inputs:
          fetch-depth: '32'
      - name: Attribute Breaking Change Check
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          git diff "$DIFF_BASE" "$DIFF_HEAD" > diff.out
          go run scripts/compatibility/breaking_change_check.go -fileNames="diff.out"
  Formatter:
    needs: CheckScope
    when: ${{ jobs.CheckScope.outputs.applicable == 'yes' }}
    steps:
      - name: Setup Go
        uses: setup-env
        inputs:
          go-version: '1.25.8'
      - uses: checkout
        inputs:
          # Checkout as many commits as needed for the diff
          fetch-depth: '0'
      - name: Format changed Go files
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          go install golang.org/x/tools/cmd/goimports@v0.24.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          python3 scripts/ci/run-format-check.py
  Compile:
    needs: CheckScope
    when: ${{ jobs.CheckScope.outputs.applicable == 'yes' }}
    steps:
      - name: Setup Go
        uses: setup-env
        inputs:
          go-version: '1.25.8'
      - uses: checkout
        inputs:
          fetch-depth: '32'
      - name: Vet changed Go packages
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          python3 scripts/ci/run-vet-check.py

  ProductionBuild:
    needs: CheckScope
    when: ${{ jobs.CheckScope.outputs.applicable == 'yes' }}
    steps:
      - uses: setup-env
        inputs:
          go-version: '1.25.8'
      - uses: checkout
        inputs:
          fetch-depth: '1'
      - name: Build root provider main
        run: |
          set -euo pipefail
          make provider-build
      - name: Check production dependency graph
        run: |
          set -euo pipefail
          make check-production-deps

  # Isolated CLI Verify Import steps preserve the prior apply for reorder checks.
  TypeListOrderCoverage:
    needs: CheckScope
    when: ${{ jobs.CheckScope.outputs.applicable == 'yes' }}
    steps:
      - uses: setup-env
        inputs:
          go-version: '1.25.8'
      - uses: checkout
        inputs:
          fetch-depth: '0'
      - run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          go test ./scripts/collection-order/internal/coverage
          python3 scripts/ci/run-provider-check.py collection
