name: Terraform Basic Checks
triggers:
  merge_request:
    target-branches:
      - master
    paths:
      - 'scripts/ci/**'
      - 'scripts/release/**'
      - 'scripts/internal/**'
      - '.aoneci/**'
      - 'go.mod'
      - 'go.sum'
      - '.aoneci/acctest-terraform-basic.yml'
      - 'alicloud/*.go'
      - 'alicloud/service/**/*.go'
  push:
    paths:
      - 'scripts/ci/**'
      - 'scripts/release/**'
      - 'scripts/internal/**'
      - '.aoneci/**'
      - 'go.mod'
      - 'go.sum'
      - '.aoneci/acctest-terraform-basic.yml'
      - 'alicloud/*.go'
      - 'alicloud/service/**/*.go'
envs:
  CODE_HEAD: '${{git.commitId}}'
  CODE_MR_ID: '${{git.merge_request.id ?: ""}}'
  CODE_MR_BASE: '${{git.merge_request.baseCommit ?: ""}}'
  CODE_PUSH_BEFORE: '${{git.push.beforeSha256 ?: ""}}'
  CODE_TARGET: '${{git.merge_request.targetBranch ?: ""}}'
  CODE_DEFAULT_BRANCH: '${{git.defaultBranch}}'
  CODE_MR_TITLE: '${{git.merge_request.title ?: ""}}'

jobs:
  PipelineSafety:
    steps:
      - uses: checkout
      - name: Range and release reconciliation regression
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/ci -p test_aone_range.py
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
  BreakingChange:
    steps:
      - name: Setup Go
        uses: setup-env
        inputs:
          go-version: '1.24.0'
      - uses: checkout
        inputs:
          # Checkout as many commits as needed for the diff
          fetch-depth: '0'
      - name: Attribute Breaking Change Check
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          git diff "$DIFF_BASE" "$DIFF_HEAD" > diff.out
          go run scripts/compatibility/breaking_change_check.go -fileNames="diff.out"
  Consistency:
    steps:
      - name: Setup Go
        uses: setup-env
        inputs:
          go-version: '1.24.0'
      - uses: checkout
        inputs:
          # Checkout as many commits as needed for the diff
          fetch-depth: '0'
      - name: Attribute Consistency Check
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          git diff "$DIFF_BASE" "$DIFF_HEAD" > diff.out
          go run scripts/consistency/consistency_check.go -fileNames="diff.out"
  Formatter:
    steps:
      - name: Setup Go
        uses: setup-env
        inputs:
          go-version: '1.24.0'
      - uses: checkout
        inputs:
          # Checkout as many commits as needed for the diff
          fetch-depth: '0'
      - name: Format changed Go files
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          go install golang.org/x/tools/cmd/goimports@v0.24.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          python3 scripts/ci/run-format-check.py
  Compile:
    steps:
      - name: Setup Go
        uses: setup-env
        inputs:
          go-version: '1.24.0'
      - uses: checkout
        inputs:
          # Checkout as many commits as needed for the diff
          fetch-depth: '0'
      - name: vet
        run: |
          make vet
