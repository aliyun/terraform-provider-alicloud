name: Documentation Checks
triggers:
  push:
    paths:
      - 'scripts/ci/**'
      - 'scripts/internal/**'
      - '.aoneci/**'
      - 'go.mod'
      - 'go.sum'
      - 'website/docs/**'
      - 'alicloud/*.go'
      - 'alicloud/service/**/*.go'
  merge_request:
    paths:
      - 'scripts/ci/**'
      - 'scripts/internal/**'
      - '.aoneci/**'
      - 'go.mod'
      - 'go.sum'
      - '.aoneci/document-check.yml'
      - 'website/docs/**'
      - 'alicloud/*.go'
      - 'alicloud/service/**/*.go'

envs:
  CODE_HEAD: '${{git.commitId}}'
  CODE_MR_ID: '${{git.merge_request.id ?: ""}}'
  CODE_MR_BASE: '${{git.merge_request.baseCommit ?: ""}}'
  CODE_PUSH_BEFORE: '${{git.push.beforeSha256 ?: ""}}'
  CODE_TARGET: '${{git.merge_request.targetBranch ?: ""}}'
  CODE_DEFAULT_BRANCH: '${{git.defaultBranch}}'
  CODE_MR_TITLE: '${{git.merge_request.title ?: ""}}'

jobs:
  terrafmt:
    steps:
      - uses: checkout
      - uses: setup-env
        inputs:
          go-version: '1.24.0'
      - name: terrafmt
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          go install github.com/katbyte/terrafmt@v0.5.7
          terrafmt diff ./website --check --pattern '*.markdown'

  basic-check:
    steps:
      - uses: checkout
        inputs:
          fetch-depth: '0'
      - uses: setup-env
        inputs:
          go-version: '1.24.0'
      - run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          bash scripts/basic-check.sh

  TestFrameworkGuard:
    steps:
      - uses: checkout
        inputs:
          fetch-depth: '0'
      - name: Reject new SDK v2 helper/resource imports
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          bash scripts/ci/test-framework-guard.sh

  Content:
    steps:
      - uses: checkout
        inputs:
          fetch-depth: '0'
      - name: Setup Go
        uses: setup-env
        inputs:
          go-version: '1.24.0'
      - name: Checking the docs content
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          while IFS= read -r -d '' doc; do
            if [[ -f "$doc" && "$doc" != website/docs/index.html.markdown ]]; then
              go run scripts/document/document_check.go "$doc"
            fi
          done < <(git diff --name-only -z --diff-filter=ACMR "$DIFF_BASE" "$DIFF_HEAD" -- website/docs)

  Consistency:
    steps:
      - name: Setup Go
        uses: setup-env
        inputs:
          go-version: '1.24.0'
      - uses: checkout
        inputs:
          fetch-depth: '0'
      - name: Integration Test Check
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          git diff "$DIFF_BASE" "$DIFF_HEAD" > diff.out
          go run scripts/consistency/consistency_check.go -fileNames="diff.out"
