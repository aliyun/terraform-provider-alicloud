name: Documentation Checks
triggers:
  push:
    branches:
      - master
  merge_request: {}

envs:
  VERIFIED_RELEASE_RETURN: >-
    ${{ pipeline.inst.triggerMode == 'MR' && git.merge_request.id != null &&
    git.repo == 'opensource-tools/terraform-provider-alicloud' &&
    git.merge_request.sourceProjectId != null && git.merge_request.sourceProjectId == git.merge_request.targetProjectId &&
    git.defaultBranch == 'master' && git.merge_request.targetBranch == git.defaultBranch &&
    secrets.PROVIDER_RELEASE_RETURN == 'v1:' + #string(git.merge_request.id) + ':' +
    git.merge_request.sourceBranch + ':' + git.merge_request.title + ':' + git.commitId ? 'yes' : 'no' }}
  # Pushes run on master; manual runs also retain the full documentation checks.
  DOCUMENT_CHECK_FULL: '${{git.merge_request.id != null ? "false" : "true"}}'
  CODE_CI_SHALLOW_RANGE: '1'
  CODE_HEAD: '${{git.commitId}}'
  CODE_MR_ID: '${{git.merge_request.id ?: ""}}'
  CODE_MR_BASE: '${{git.merge_request.baseCommit ?: ""}}'
  CODE_PUSH_BEFORE: '${{git.push.beforeSha256 ?: ""}}'
  CODE_TARGET: '${{git.merge_request.targetBranch ?: ""}}'
  CODE_DEFAULT_BRANCH: '${{git.defaultBranch}}'
  CODE_MR_TITLE: '${{git.merge_request.title ?: ""}}'

jobs:
  CheckScope:
    outputs:
      docs: ${{ steps.scope.outputs.docs }}
      provider: ${{ steps.scope.outputs.provider }}
      framework: ${{ steps.scope.outputs.framework }}
    steps:
      - uses: checkout
        inputs:
          fetch-depth: '32'
      - id: scope
        name: Select applicable documentation and Go checks
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          python3 -m unittest discover -s scripts/ci -p test_document_scope.py
          python3 scripts/ci/document_scope.py
  ReleaseReturn:
    when: ${{ envs.VERIFIED_RELEASE_RETURN == 'yes' }}
    steps:
      - name: Record release return exemption
        run: echo "Verified release return MR $CODE_MR_ID at $CODE_HEAD. Skipped MarkdownQuality by policy."
  MarkdownQuality:
    needs: CheckScope
    when: ${{ envs.VERIFIED_RELEASE_RETURN != 'yes' && jobs.CheckScope.outputs.docs == 'yes' }}
    steps:
      - uses: checkout
        inputs:
          fetch-depth: '32'
      - uses: setup-env
        inputs:
          node-version: '20'
      - name: Check Markdown links and lint
        envs:
          CODE_CI_SHALLOW_RANGE: '1'
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          python3 -m unittest discover -s scripts/ci -p test_note_diagnostics.py
          python3 scripts/ci/run-document-checks.py --group node

  terrafmt:
    needs: CheckScope
    when: ${{ jobs.CheckScope.outputs.docs == 'yes' }}
    steps:
      - uses: checkout
        inputs:
          fetch-depth: '32'
      - uses: setup-env
        inputs:
          go-version: '1.25.8'
      - name: terrafmt
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          export TF_DOC_TOOLS_DIR
          TF_DOC_TOOLS_DIR=$(mktemp -d)
          trap 'rm -rf "$TF_DOC_TOOLS_DIR"' EXIT
          GOBIN="$TF_DOC_TOOLS_DIR" go install github.com/katbyte/terrafmt@v0.5.7
          python3 scripts/ci/run-document-checks.py --group format

  basic-check:
    needs: CheckScope
    when: ${{ jobs.CheckScope.outputs.provider == 'yes' }}
    steps:
      - uses: checkout
        inputs:
          fetch-depth: '32'
      - run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          bash scripts/basic-check.sh

  TestFrameworkGuard:
    needs: CheckScope
    when: ${{ jobs.CheckScope.outputs.framework == 'yes' }}
    steps:
      - uses: checkout
        inputs:
          fetch-depth: '32'
      - name: Reject new SDK v2 helper/resource imports
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          bash scripts/ci/test-framework-guard.sh

  Content:
    needs: CheckScope
    when: ${{ jobs.CheckScope.outputs.docs == 'yes' }}
    steps:
      - uses: checkout
        inputs:
          fetch-depth: '32'
      - name: Setup Go
        uses: setup-env
        inputs:
          go-version: '1.25.8'
      - name: Checking the docs content
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          checker_dir=$(mktemp -d)
          trap 'rm -rf "$checker_dir"' EXIT
          # scripts/document/document_check.go classifies pages by directory
          # (r, d, actions, ephemeral-resources, functions, guides) and only
          # applies the generated-name title template to object pages; both CI
          # entries share that classification. The provider index page stays
          # excluded because its argument notes and shell examples do not fit
          # the page sections the checker walks.
          while IFS= read -r -d '' doc; do
            if [[ -f "$doc" && "$doc" != website/docs/index.html.markdown ]]; then
              if [[ ! -x "$checker_dir/document-check" ]]; then
                go build -o "$checker_dir/document-check" scripts/document/document_check.go
              fi
              "$checker_dir/document-check" "$doc"
            fi
          done < <(git diff --name-only -z --diff-filter=ACMR "$DIFF_BASE" "$DIFF_HEAD" -- website/docs)

      - name: Test document checker and check spelling
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          go test ./scripts/document/
          export TF_DOC_TOOLS_DIR
          TF_DOC_TOOLS_DIR=$(mktemp -d)
          trap 'rm -rf "$TF_DOC_TOOLS_DIR"' EXIT
          GOBIN="$TF_DOC_TOOLS_DIR" go install github.com/client9/misspell/cmd/misspell@v0.3.4
          python3 scripts/ci/run-document-checks.py --group spelling

  # Single owner of the attribute consistency gate, including Basic-only paths.
  Consistency:
    needs: CheckScope
    when: ${{ jobs.CheckScope.outputs.provider == 'yes' }}
    steps:
      - name: Setup Go
        uses: setup-env
        inputs:
          go-version: '1.25.8'
      - uses: checkout
        inputs:
          fetch-depth: '32'
      # The checker is code: its parsing regressions must fail before the run,
      # otherwise a broken parser silently reports PASS for every entity.
      - name: Consistency checker unit tests
        run: go test ./scripts/consistency/
      - name: Attribute Consistency Check
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          git diff "$DIFF_BASE" "$DIFF_HEAD" > diff.out
          go run scripts/consistency/consistency_check.go -fileNames="diff.out"
