name: Documentation Checks
triggers:
  push:
    paths:
      - 'scripts/ci/**'
      - 'scripts/release/**'
      - 'scripts/collection-order/**'
      - 'GNUmakefile'
      - 'scripts/internal/**'
      - '.aoneci/**'
      - 'go.mod'
      - 'go.sum'
      - 'website/docs/**'
      - 'scripts/document/**'
      - 'scripts/basic-check.sh'
      - '.markdown-link-check.json'
      - '.github/markdownlint/**'
      - 'alicloud/*.go'
      - 'alicloud/service/**/*.go'
  merge_request:
    paths:
      - 'scripts/ci/**'
      - 'scripts/release/**'
      - 'scripts/collection-order/**'
      - 'GNUmakefile'
      - 'scripts/internal/**'
      - '.aoneci/**'
      - 'go.mod'
      - 'go.sum'
      - '.aoneci/document-check.yml'
      - 'website/docs/**'
      - 'scripts/document/**'
      - 'scripts/basic-check.sh'
      - '.markdown-link-check.json'
      - '.github/markdownlint/**'
      - 'alicloud/*.go'
      - 'alicloud/service/**/*.go'

envs:
  CODE_CI_SHALLOW_RANGE: '1'
  CODE_HEAD: '${{git.commitId}}'
  CODE_MR_ID: '${{git.merge_request.id ?: ""}}'
  CODE_MR_BASE: '${{git.merge_request.baseCommit ?: ""}}'
  CODE_PUSH_BEFORE: '${{git.push.beforeSha256 ?: ""}}'
  CODE_TARGET: '${{git.merge_request.targetBranch ?: ""}}'
  CODE_DEFAULT_BRANCH: '${{git.defaultBranch}}'
  CODE_MR_TITLE: '${{git.merge_request.title ?: ""}}'

jobs:
  MarkdownQuality:
    steps:
      - uses: checkout
        inputs:
          fetch-depth: '32'
      - uses: setup-env
        inputs:
          node-version: '20'
      - name: Diagnose Registry connectivity
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import json
          import os
          import socket
          import subprocess

          url = 'https://registry.terraform.io/providers/aliyun/alicloud/latest/docs/resources/db_connection'
          proxy_names = ('http_proxy', 'https_proxy', 'HTTP_PROXY', 'HTTPS_PROXY', 'ALL_PROXY', 'NO_PROXY', 'no_proxy')
          print(json.dumps({'proxy_present': {name: bool(os.environ.get(name)) for name in proxy_names}}), flush=True)
          try:
              print(json.dumps({'addresses': sorted({row[4][0] for row in socket.getaddrinfo('registry.terraform.io', 443)})}), flush=True)
          except OSError as error:
              print(json.dumps({'dns_error': type(error).__name__}), flush=True)
          curl = ['curl', '--silent', '--show-error', '--location', '--output', '/dev/null', '--write-out', 'HTTP=%{http_code}', '--connect-timeout', '5', '--max-time', '15']
          checker = ['npx', '--yes', 'markdown-link-check@3.14.2', '--verbose', '--config', '.markdown-link-check.json']
          probes = [
              ('curl-default', curl + [url], None, dict(os.environ)),
              ('curl-ipv4', curl + ['--ipv4', url], None, dict(os.environ)),
              ('link-check-default', checker, '[registry](' + url + '#port)\n', dict(os.environ)),
              ('link-check-ipv4first', checker, '[registry](' + url + '#port)\n', dict(os.environ, NODE_OPTIONS=(os.environ.get('NODE_OPTIONS', '') + ' --dns-result-order=ipv4first').strip())),
          ]
          def run(probe):
              name, command, stdin, env = probe
              try:
                  result = subprocess.run(command, input=stdin, env=env, text=True, capture_output=True, timeout=75)
                  return {'probe': name, 'exit': result.returncode, 'stdout': result.stdout, 'stderr': result.stderr}
              except subprocess.TimeoutExpired:
                  return {'probe': name, 'timeout': True}
          with ThreadPoolExecutor(max_workers=4) as pool:
              for result in pool.map(run, probes):
                  print(json.dumps(result), flush=True)
          PY
      - name: Check Markdown links and lint
        envs:
          CODE_CI_SHALLOW_RANGE: '1'
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          python3 scripts/ci/run-document-checks.py --group node

  terrafmt:
    steps:
      - uses: checkout
        inputs:
          fetch-depth: '32'
      - uses: setup-env
        inputs:
          go-version: '1.25.8'
      - name: terrafmt
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          export PATH="$PATH:$(go env GOPATH)/bin"
          tool_ready=false
          while IFS= read -r -d '' doc; do
            if [[ -f "$doc" && "$doc" == *.markdown ]]; then
              if [[ "$tool_ready" == false ]]; then
                go install github.com/katbyte/terrafmt@v0.5.7
                tool_ready=true
              fi
              terrafmt diff "$doc" --check --pattern '*.markdown'
            fi
          done < <(git diff --name-only -z --diff-filter=ACMR "$DIFF_BASE" "$DIFF_HEAD" -- website/docs)

  basic-check:
    steps:
      - uses: checkout
        inputs:
          fetch-depth: '32'
      - run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          bash scripts/basic-check.sh

  TestFrameworkGuard:
    steps:
      - uses: checkout
        inputs:
          fetch-depth: '32'
      - name: Reject new SDK v2 helper/resource imports
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          bash scripts/ci/test-framework-guard.sh

  Content:
    steps:
      - uses: checkout
        inputs:
          fetch-depth: '32'
      - name: Setup Go
        uses: setup-env
        inputs:
          go-version: '1.25.8'
      - name: Checking the docs content
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          checker_dir=$(mktemp -d)
          trap 'rm -rf "$checker_dir"' EXIT
          while IFS= read -r -d '' doc; do
            if [[ -f "$doc" && "$doc" != website/docs/index.html.markdown ]]; then
              if [[ ! -x "$checker_dir/document-check" ]]; then
                go build -o "$checker_dir/document-check" scripts/document/document_check.go
              fi
              "$checker_dir/document-check" "$doc"
            fi
          done < <(git diff --name-only -z --diff-filter=ACMR "$DIFF_BASE" "$DIFF_HEAD" -- website/docs)

      - name: Test document checker and check spelling
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          go test ./scripts/document/
          export TF_DOC_TOOLS_DIR
          TF_DOC_TOOLS_DIR=$(mktemp -d)
          trap 'rm -rf "$TF_DOC_TOOLS_DIR"' EXIT
          GOBIN="$TF_DOC_TOOLS_DIR" go install github.com/client9/misspell/cmd/misspell@v0.3.4
          python3 scripts/ci/run-document-checks.py --group spelling

  # Single owner of the attribute consistency gate, including Basic-only paths.
  Consistency:
    steps:
      - name: Setup Go
        uses: setup-env
        inputs:
          go-version: '1.25.8'
      - uses: checkout
        inputs:
          fetch-depth: '32'
      - name: Attribute Consistency Check
        run: |
          set -euo pipefail
          range=$(python3 scripts/ci/aone-range.py)
          eval "$range"
          git diff "$DIFF_BASE" "$DIFF_HEAD" > diff.out
          go run scripts/consistency/consistency_check.go -fileNames="diff.out"
