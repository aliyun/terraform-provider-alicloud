name: Terraform Integration Checks
strategy:
  fast-fail: false
triggers:
  merge_request:
    types: [accepted]
  push:
    branches: [master]
    paths:
      - 'scripts/ci/**'
      - 'scripts/release/**'
      - 'scripts/internal/**'
      - '.aoneci/**'
      - 'go.mod'
      - 'go.sum'
      - 'website/docs/**'
      - 'ci/assets/document-examples/**'
      - 'ci/assets/open-service/**'
      - 'examples/**'
      - '**/*.tf'
      - '**/*.hcl'
      - 'alicloud/*.go'
      - 'alicloud/**'

envs:
  VERIFIED_RELEASE_RETURN: >-
    ${{ pipeline.inst.triggerMode == 'MR' && git.merge_request.id != null &&
    git.repo == 'opensource-tools/terraform-provider-alicloud' &&
    git.merge_request.sourceProjectId != null && git.merge_request.sourceProjectId == git.merge_request.targetProjectId &&
    git.defaultBranch == 'master' && git.merge_request.targetBranch == git.defaultBranch &&
    secrets.PROVIDER_RELEASE_RETURN == 'v1:' + #string(git.merge_request.id) + ':' +
    git.merge_request.sourceBranch + ':' + git.merge_request.title + ':' + git.commitId ? 'yes' : 'no' }}
  CODE_CI_SHALLOW_RANGE: '1'
  CODE_HEAD: '${{git.commitId}}'
  CODE_MR_ID: '${{git.merge_request.id ?: ""}}'
  CODE_MR_BASE: '${{git.merge_request.baseCommit ?: ""}}'
  CODE_PUSH_BEFORE: '${{git.push.beforeSha256 ?: ""}}'
  CODE_TARGET: '${{git.merge_request.targetBranch ?: ""}}'
  CODE_DEFAULT_BRANCH: '${{git.defaultBranch}}'
  CODE_MR_TITLE: '${{git.merge_request.title ?: ""}}'

jobs:
  CheckScope:
    outputs:
      applicable: ${{ steps.scope.outputs.applicable }}
    steps:
      - name: Record release return exemption
        when: ${{ envs.VERIFIED_RELEASE_RETURN == 'yes' }}
        run: echo "Verified release return MR $CODE_MR_ID at $CODE_HEAD. Skipped IntegrationTest, DocsExampleTest by policy."
      - uses: checkout
        when: ${{ envs.VERIFIED_RELEASE_RETURN == 'no' }}
        inputs:
          fetch-depth: '32'
      - id: scope
        name: Determine whether integration tests apply
        run: |
          set -euo pipefail
          if [[ "$VERIFIED_RELEASE_RETURN" == yes ]]; then
            applicable=no
          elif [[ -z "$CODE_MR_ID" ]]; then
            applicable=yes
          else
            range=$(python3 scripts/ci/aone-range.py)
            eval "$range"
            result=0
            git diff --quiet --no-ext-diff "$DIFF_BASE" "$DIFF_HEAD" -- \
              ':(glob)scripts/ci/**' \
              ':(glob)scripts/release/**' \
              ':(glob)scripts/internal/**' \
              ':(glob).aoneci/**' \
              ':(glob)go.mod' \
              ':(glob)go.sum' \
              ':(glob)website/docs/**' \
              ':(glob)ci/assets/document-examples/**' \
              ':(glob)ci/assets/open-service/**' \
              ':(glob)examples/**' \
              ':(glob)**/*.tf' \
              ':(glob)**/*.hcl' \
              ':(glob)alicloud/*.go' \
              ':(glob)alicloud/**' || result=$?
            case "$result" in
              0) applicable=no
                 echo "No integration-related files changed. AccTest and DocsExampleTest are unnecessary for this MR." ;;
              1) applicable=yes ;;
              *) exit "$result" ;;
            esac
          fi
          printf '%s' "$applicable" > "$AONE_CI_OUTPUTS/applicable"
  IntegrationTest:
    needs: CheckScope
    when: ${{ envs.VERIFIED_RELEASE_RETURN != 'yes' && jobs.CheckScope.outputs.applicable == 'yes' }}
    timeout: 9h
    steps:
      - name: Setup Go
        uses: setup-env
        inputs:
          go-version: '1.25.8'
      - uses: checkout
        inputs:
          fetch-depth: '32'
      - name: CI Adapter Regression
        run: env -u AONE_CI_SUMMARY_MD -u AONE_CI_SUMMARY python3 -m unittest discover -s scripts/ci -p 'test_acube_*.py'
      - name: Integration Test Check
        envs:
          ACUBE_PROVIDER_RUN_TOKEN: '${{secrets.ACUBE_PROVIDER_RUN_TOKEN}}'
          ACUBE_CI_RUN_ID: '${{pipeline.inst.id}}'
        run: python3 scripts/ci/acube-integration.py --kind acctest
      - name: Publish AccTest Diagnostics
        when: ${{always()}}
        uses: upload-artifact
        inputs:
          name: acube-acctest-diagnostics
          path: .acube-ci/diagnostics/*
          if-no-files-found: error
  DocsExampleTest:
    needs: CheckScope
    when: ${{ envs.VERIFIED_RELEASE_RETURN != 'yes' && jobs.CheckScope.outputs.applicable == 'yes' }}
    timeout: 9h
    steps:
      - name: Setup Go
        uses: setup-env
        inputs:
          go-version: '1.25.8'
      - uses: checkout
        inputs:
          fetch-depth: '32'
      - name: Docs Example Test Check
        envs:
          ACUBE_PROVIDER_RUN_TOKEN: '${{secrets.ACUBE_PROVIDER_RUN_TOKEN}}'
          ACUBE_CI_RUN_ID: '${{pipeline.inst.id}}'
        run: python3 scripts/ci/acube-integration.py --kind examples
      - name: Publish Example Diagnostics
        when: ${{always()}}
        uses: upload-artifact
        inputs:
          name: acube-example-diagnostics
          path: .acube-ci/diagnostics/*
          if-no-files-found: error
