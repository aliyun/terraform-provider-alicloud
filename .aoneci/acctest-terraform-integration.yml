name: Terraform Integration Checks
strategy:
  fast-fail: false
  concurrency:
    group: '${{git.merge_request?.id ?: git.branch}}'
    parallelism: 1
    cancel-in-progress: false
triggers:
  merge_request:
    types: [opened, reopened]
    paths:
      - 'scripts/ci/**'
      - 'scripts/release/**'
      - 'scripts/internal/**'
      - '.aoneci/**'
      - 'go.mod'
      - 'go.sum'
      - 'website/docs/**'
      - 'alicloud/*.go'
      - 'alicloud/service/**/*.go'
  push:
    branches: [master]
    paths:
      - 'scripts/ci/**'
      - 'scripts/release/**'
      - 'scripts/internal/**'
      - '.aoneci/**'
      - 'go.mod'
      - 'go.sum'
      - 'website/docs/**'
      - 'alicloud/*.go'
      - 'alicloud/service/**/*.go'

envs:
  CODE_HEAD: '${{git.commitId}}'
  CODE_MR_ID: '${{git.merge_request.id ?: ""}}'
  CODE_MR_BASE: '${{git.merge_request.baseCommit ?: ""}}'
  CODE_PUSH_BEFORE: '${{git.push.beforeSha256 ?: ""}}'
  CODE_TARGET: '${{git.merge_request.targetBranch ?: ""}}'
  CODE_DEFAULT_BRANCH: '${{git.defaultBranch}}'
  CODE_MR_TITLE: '${{git.merge_request.title ?: ""}}'

  ACUBE_PROVIDER_RUN_TOKEN: '${{secrets.ACUBE_PROVIDER_RUN_TOKEN}}'

jobs:
  IntegrationTest:
    timeout: 9h
    steps:
      - name: Setup Go
        uses: setup-env
        inputs:
          go-version: '1.25.8'
      - uses: checkout
        inputs:
          fetch-depth: '0'
      - name: CI Adapter Regression
        run: python3 -m unittest discover -s scripts/ci -p test_acube_integration.py
      - name: Integration Test Check
        envs:
          ACUBE_CI_RUN_ID: '${{pipeline.inst.id}}'
        run: python3 scripts/ci/acube-integration.py --kind acctest
  DocsExampleTest:
    timeout: 9h
    steps:
      - name: Setup Go
        uses: setup-env
        inputs:
          go-version: '1.25.8'
      - uses: checkout
        inputs:
          fetch-depth: '0'
      - name: Docs Example Test Check
        envs:
          ACUBE_CI_RUN_ID: '${{pipeline.inst.id}}'
        run: python3 scripts/ci/acube-integration.py --kind examples
